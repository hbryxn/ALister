<title>ALister</title>
<meta name="description" content="Turn a pile of clothing photos into eBay, Depop and Vinted listings, then track every piece to sold.">

<style>
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url("fonts/public-sans-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url("fonts/public-sans-600.woff2") format("woff2"); font-weight: 500 600; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url("fonts/public-sans-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one narrow working column (max 1080px) under a sticky bar; cards only where an object is a real thing (a bag, an item). */
:root {
  --bg: #e9e6ef;          /* cool lilac-grey ground */
  --surface: #f7f6fa;
  --surface-2: #efedf4;
  --ink: #231f2b;
  --muted: #655e73;
  --line: #d6d1df;
  --plum: #6a2c5b;
  --plum-soft: #f0e3ec;
  --on-plum: #ffffff;
  --manila: #e6d2a2;
  --manila-ink: #3a2e14;
  --ok: #2c7049;
  --ok-soft: #dfeee4;
  --warn: #93590f;
  --warn-soft: #f6e9d2;
  --bad: #a3271f;
  --bad-soft: #f7dfdc;
  --shadow: 0 1px 2px rgba(35, 31, 43, .06), 0 4px 14px rgba(35, 31, 43, .06);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16141b; --surface: #201d27; --surface-2: #29252f; --ink: #ece9f1; --muted: #a49db0; --line: #37323f;
    --plum: #d79cc7; --plum-soft: #3b2536; --on-plum: #2a0f22; --manila: #c9b17b; --manila-ink: #2d230e;
    --ok: #79c495; --ok-soft: #1f3327; --warn: #e0ad62; --warn-soft: #3a2d17; --bad: #f08c82; --bad-soft: #3d1f1d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16141b; --surface: #201d27; --surface-2: #29252f; --ink: #ece9f1; --muted: #a49db0; --line: #37323f;
  --plum: #d79cc7; --plum-soft: #3b2536; --on-plum: #2a0f22; --manila: #c9b17b; --manila-ink: #2d230e;
  --ok: #79c495; --ok-soft: #1f3327; --warn: #e0ad62; --warn-soft: #3a2d17; --bad: #f08c82; --bad-soft: #3d1f1d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--plum); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; } /* keeps iOS from zooming */
:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1080px; margin: 0 auto; padding: 8px var(--gutter); display: flex; align-items: center; gap: 8px; min-height: 56px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 0; cursor: pointer; }
.brand .tag-mini { width: 22px; height: 14px; background: var(--manila); clip-path: polygon(6px 0, 100% 0, 100% 100%, 6px 100%, 0 50%); }
.bar nav { margin-left: auto; display: flex; gap: 4px; }

main { max-width: 1080px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 20px 120px; display: flex; flex-direction: column; gap: 20px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--plum); border-color: var(--plum); color: var(--on-plum); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: .88rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.copied { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.icon-btn { min-width: 44px; min-height: 44px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; font-size: 1.2rem; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.panel { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.notice { border-radius: var(--r); padding: 12px 14px; background: var(--surface-2); display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.notice.warn { background: var(--warn-soft); color: var(--ink); }
.notice.bad { background: var(--bad-soft); }
.notice.ok { background: var(--ok-soft); }
.notice p { flex: 1 1 260px; min-width: 0; }

/* chips and pills */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.plum { background: var(--plum-soft); color: var(--plum); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
button.chip { border: 0; cursor: pointer; min-height: 28px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 600; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; min-height: 38px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* hang-tag price: the one signature element */
.hangtag { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 84px;
  padding: 6px 14px 6px 26px; background: var(--manila); color: var(--manila-ink);
  clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%); border-radius: 0 6px 6px 0; }
.hangtag::before { content: ""; position: absolute; left: 13px; top: 50%; width: 8px; height: 8px; border-radius: 50%; transform: translate(-50%, -50%);
  background: var(--surface); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--manila-ink) 30%, transparent); }
.hangtag .p { font-family: var(--display); font-weight: 800; font-size: 1.35rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hangtag .l { font-size: .7rem; font-weight: 600; opacity: .75; }
.hangtag.sm { min-width: 0; padding: 3px 10px 3px 20px; }
.hangtag.sm::before { left: 10px; width: 6px; height: 6px; }
.hangtag.sm .p { font-size: 1rem; }

/* totals strip */
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.totals > div { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.totals .k { font-size: .8rem; color: var(--muted); font-weight: 600; }
.totals .v { font-family: var(--display); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.totals .v.neg { color: var(--bad); }
.totals .v.pos { color: var(--ok); }

/* bag list */
.bags { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.bag-card { text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px; color: var(--ink); }
.bag-card:hover { border-color: var(--muted); }
.bag-thumbs { display: flex; gap: 4px; height: 64px; overflow: hidden; }
.bag-thumbs img, .bag-thumbs span { width: 48px; height: 64px; object-fit: cover; border-radius: 4px; background: var(--surface-2); flex: none; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { display: flex; flex-direction: column; min-width: 0; }
.kv .k { font-size: .75rem; color: var(--muted); }
.kv .v { font-weight: 700; font-variant-numeric: tabular-nums; }

/* empty state */
.empty { text-align: left; padding: 28px 20px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.steps3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.steps3 > div { background: var(--surface-2); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.steps3 b { font-family: var(--display); font-size: 1.05rem; }

/* forms */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lab { font-size: .85rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); width: 100%; }
.field textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--plum); }

/* drop zone */
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; background: var(--surface); }
.drop.over { border-color: var(--plum); background: var(--plum-soft); }
.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--plum); transition: width .3s; }
.meter > i { background: var(--ok); }
.meter.full > i { background: var(--bad); }

/* photo grid */
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.thumb { position: relative; aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; background: var(--surface-2); border: 0; padding: 0; cursor: pointer; max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .n { position: absolute; left: 3px; top: 3px; background: var(--ink); color: var(--bg); font-size: .7rem; font-weight: 700; padding: 0 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.thumb .v { position: absolute; left: 3px; bottom: 3px; background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--ink); font-size: .65rem; padding: 0 5px; border-radius: 4px; }
.thumb .flag { position: absolute; right: 3px; top: 3px; background: var(--warn); color: var(--surface); font-size: .65rem; font-weight: 700; padding: 0 5px; border-radius: 4px; }
.thumb .cover { position: absolute; right: 3px; bottom: 3px; background: var(--manila); color: var(--manila-ink); font-size: .65rem; font-weight: 700; padding: 0 5px; border-radius: 4px; }
.thumb[aria-pressed="true"] { outline: 3px solid var(--plum); outline-offset: -3px; }
.thumb[aria-pressed="true"]::after { content: "✓"; position: absolute; right: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--plum); color: var(--on-plum); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.thumb.excluded img { opacity: .35; filter: grayscale(1); }

/* review groups */
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group.drop-target { outline: 2px dashed var(--plum); outline-offset: 2px; }
.group h3 { font-size: 1rem; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; }
.stepper button { min-width: 40px; min-height: 40px; border: 0; background: transparent; cursor: pointer; font-size: 1.1rem; }
.stepper span { min-width: 2ch; text-align: center; font-weight: 700; }
.sizes { display: flex; gap: 6px; flex-wrap: wrap; }
.sizes input { width: 80px; min-height: 40px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

/* sticky action dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.dock-in { max-width: 1080px; margin: 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.dock-in .grow { font-weight: 600; }

/* run progress */
.runlist { display: flex; flex-direction: column; gap: 2px; }
.runlist > div { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); min-height: 44px; }
.runlist .st { width: 74px; flex: none; }
.stream { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .78rem; color: var(--muted); max-height: 4.5em; overflow: hidden; white-space: pre-wrap; word-break: break-word; }

/* listings */
.items { display: flex; flex-direction: column; gap: 14px; }
.item { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; }
.item .cover-img { width: 120px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: var(--surface-2); display: block; max-width: 100%; }
.item-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.item-head .t { min-width: 0; flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px; }
.brandline { font-size: .8rem; font-weight: 700; color: var(--plum); letter-spacing: .02em; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.facts button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 4px 8px; min-height: 32px; cursor: pointer; font-size: .85rem; text-align: left; }
.facts button.unc { border-color: var(--warn); background: var(--warn-soft); }
.facts button .k { color: var(--muted); margin-right: 4px; }
.copyrow { display: flex; flex-direction: column; gap: 6px; }
.copyrow .lab { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: .8rem; font-weight: 600; color: var(--muted); }
.titlebox { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); cursor: text; text-align: left; width: 100%; font-weight: 600; min-height: 44px; }
.descbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface-2); max-height: 180px; overflow: auto; white-space: pre-wrap; font-size: .88rem; line-height: 1.45; }
.counter.over { color: var(--bad); font-weight: 700; }
.notes { margin: 0; padding: 10px 12px 10px 28px; background: var(--warn-soft); border-radius: 8px; font-size: .88rem; }
.notes li + li { margin-top: 4px; }
.units { display: flex; flex-direction: column; gap: 6px; }
.unit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid var(--line); }
.unit select { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: 100%; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; min-width: 210px; display: flex; flex-direction: column; }
.menu-list button { text-align: left; border: 0; background: transparent; min-height: 44px; padding: 0 12px; border-radius: 6px; cursor: pointer; }
.menu-list button:hover { background: var(--surface-2); }

/* profit table → cards on phones */
.ptable { width: 100%; border-collapse: collapse; font-size: .9rem; }
.ptable th { text-align: right; font-size: .78rem; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line); }
.ptable td { text-align: right; padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.ptable th:first-child, .ptable td:first-child { text-align: left; }
.ptable td.neg { color: var(--bad); }
@media (max-width: 640px) {
  .ptable thead { display: none; }
  .ptable, .ptable tbody, .ptable tr, .ptable td { display: block; width: 100%; }
  .ptable tr { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; }
  .ptable td { border: 0; padding: 2px 0; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
  .ptable td::before { content: attr(data-label); color: var(--muted); font-size: .78rem; }
  .ptable td:first-child { grid-column: 1 / -1; font-weight: 700; }
  .ptable td:first-child::before { content: none; }
  .item { grid-template-columns: 76px minmax(0, 1fr); gap: 12px; }
  .item .cover-img { width: 76px; }
  .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  h1 { font-size: 1.45rem; }
}

/* sheet (modal) */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(20, 16, 26, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 16px 16px 0 0;
  padding: 20px var(--gutter) calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 16px; } }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.diff { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.diff > div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .88rem; }
.diff del { color: var(--bad); text-decoration: line-through; display: block; }
.diff ins { color: var(--ok); text-decoration: none; display: block; }
.picklist { display: flex; flex-direction: column; gap: 4px; }
.picklist button { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-height: 52px; cursor: pointer; }
.picklist img { width: 32px; height: 42px; object-fit: cover; border-radius: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.loading { padding: 48px 0; text-align: center; color: var(--muted); }
details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
main > .btn, main > form > .row > .btn { align-self: flex-start; }

<body>
<header class="bar"><div class="bar-in">
  <button class="brand" data-act="nav" data-to="home"><span class="tag-mini" aria-hidden="true"></span>ALister</button>
  <nav id="nav" aria-label="Main"></nav>
</div></header>
<main id="main"><div class="loading">Loading your inventory…</div></main>
<div id="dock" class="dock" hidden></div>
<div id="sheet" hidden></div>

<script src="vendor/anthropic.js"></script>
<script>
/* ALister core: pure functions only (no DOM, no network).
   Loaded inline by the page and by tests/core.test.js under Node. */
(function (root) {
  'use strict';

  const PLATFORMS = ['ebay', 'depop', 'vinted'];
  const PLATFORM_LABEL = { ebay: 'eBay', depop: 'Depop', vinted: 'Vinted' };
  const CLOSED = ['sold', 'kept', 'donated'];
  const VIEWS = ['front', 'back', 'label', 'care_tag', 'price_tag', 'detail', 'measurement', 'flaw', 'other'];
  const DETAIL_VIEWS = ['label', 'care_tag', 'price_tag', 'measurement'];
  const VIEW_PRIORITY = ['label', 'care_tag', 'price_tag', 'measurement', 'front', 'back', 'flaw', 'detail', 'other'];
  const BANNED_RE = /\b(100%\s*)?(authentic|genuine|legit|real deal)\b/i;
  const BANNED_RE_G = /\b(100%\s*)?(authentic|genuine|legit|real deal)\b/gi;
  const TEXT_FIELDS = ['brand', 'name', 'category', 'size', 'color', 'material', 'measurements', 'condition',
    'retailNote', 'styleCode', 'blurb', 'depopFirstLine', 'priceReasoning', 'bestPlatform'];
  const ANALYSIS_FIELDS = TEXT_FIELDS.concat(['titles.ebay', 'titles.vinted', 'tags', 'listPrice', 'estSale',
    'priceConfidence', 'sellerNotes']);
  const FIELD_LABEL = {
    brand: 'Brand', name: 'Name', category: 'Category', size: 'Size', color: 'Color', material: 'Material',
    measurements: 'Measurements', condition: 'Condition', retailNote: 'Retail note', styleCode: 'Style code',
    blurb: 'Description', depopFirstLine: 'Depop first line', priceReasoning: 'Price reasoning',
    bestPlatform: 'Best platform', 'titles.ebay': 'eBay title', 'titles.vinted': 'Vinted title', tags: 'Hashtags',
    listPrice: 'List price', estSale: 'Est. sale', priceConfidence: 'Price confidence', sellerNotes: 'Seller notes'
  };

  const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
  const num = (n) => { const v = Number(n); return Number.isFinite(v) ? v : 0; };
  const isClosed = (unit) => CLOSED.includes(unit && unit.status);

  /* ---------- fees and profit (§7) ---------- */

  function feeFor(price, platform, fees, opts) {
    const f = fees && fees[platform];
    const p = num(price);
    if (!f || p <= 0) return 0;
    let fee = p * num(f.pct) + num(f.fixed);
    if (platform === 'depop' && opts && opts.boost) fee += p * num(f.boostPct);
    return round2(fee);
  }

  function netFor(price, platform, fees, costBasis, shipping, opts) {
    return round2(num(price) - feeFor(price, platform, fees, opts) - num(costBasis) - num(shipping));
  }

  /** Estimated per-unit sale price on a platform. Vinted applies the price factor. */
  function platformEst(item, platform, settings) {
    const est = num(item.estSale);
    return platform === 'vinted' ? round2(est * num(settings.vintedPriceFactor || 1)) : est;
  }

  function platformListPrice(item, platform, settings) {
    const lp = num(item.listPrice);
    return platform === 'vinted' ? Math.round(lp * num(settings.vintedPriceFactor || 1)) : lp;
  }

  function snapshotOf(unit) {
    if (!unit) return null;
    if (unit.status === 'sold' && unit.sale && unit.sale.costBasisSnapshot != null) return num(unit.sale.costBasisSnapshot);
    if (unit.costBasisSnapshot != null) return num(unit.costBasisSnapshot);
    return null;
  }

  const hasOverride = (item) => item.costOverride != null && item.costOverride !== '' && Number.isFinite(Number(item.costOverride));

  /**
   * Split a bag's purchase cost across its units.
   * Closed units keep their snapshot; overridden units use the override;
   * the rest share what remains by estSale (or evenly).
   */
  function allocateCosts(bag, items, settings) {
    const basis = {};
    const pool = [];
    let fixed = 0;
    for (const item of items) {
      for (const unit of item.units || []) {
        const key = item.id + ':' + unit.n;
        const snap = isClosed(unit) ? snapshotOf(unit) : null;
        if (snap != null) { basis[key] = snap; fixed += snap; }
        else if (hasOverride(item)) { basis[key] = num(item.costOverride); fixed += num(item.costOverride); }
        else pool.push({ key, w: Math.max(0, num(item.estSale)) });
      }
    }
    const raw = num(bag && bag.purchaseCost) - fixed;
    const overspent = raw < 0;
    const remaining = Math.max(0, raw);
    const even = (settings && settings.costAllocation) === 'even';
    const total = pool.reduce((s, u) => s + u.w, 0);
    for (const u of pool) {
      const share = (!even && total > 0) ? u.w / total : 1 / pool.length;
      basis[u.key] = round2(remaining * share);
    }
    return { basis, remaining: round2(remaining), overspent };
  }

  function realizedFor(unit) {
    if (!unit) return 0;
    if (unit.status === 'sold' && unit.sale) {
      const s = unit.sale;
      return round2(num(s.price) - num(s.feeAmount) - num(s.costBasisSnapshot) - num(s.shippingPaid));
    }
    if (unit.status === 'kept' || unit.status === 'donated') return round2(-num(unit.costBasisSnapshot));
    return 0;
  }

  function makeSale(input, settings, costBasis) {
    const platform = input.platform;
    const fees = settings.fees || {};
    const rates = JSON.parse(JSON.stringify(fees[platform] || {}));
    const boost = platform === 'depop' && !!input.boost;
    rates.boostApplied = boost;
    return {
      price: round2(input.price), platform, date: input.date,
      feeRatesSnapshot: rates,
      feeAmount: feeFor(input.price, platform, fees, { boost }),
      costBasisSnapshot: round2(costBasis),
      shippingPaid: round2(input.shippingPaid)
    };
  }

  /** Totals for one bag. opts: {boost, shipping} */
  function bagTotals(bag, items, settings, opts) {
    opts = opts || {};
    const shipping = opts.shipping != null ? num(opts.shipping) : num(settings.defaultShippingCovered);
    const alloc = allocateCosts(bag, items, settings);
    const t = {
      unrealized: { ebay: 0, depop: 0, vinted: 0 }, realized: 0,
      moneyIn: round2(bag ? bag.purchaseCost : 0), moneyOut: 0,
      soldUnits: 0, totalUnits: 0, openUnits: 0, overspent: alloc.overspent, basis: alloc.basis, perItem: {}
    };
    for (const item of items) {
      const row = { units: 0, open: 0, cost: 0, est: num(item.estSale), net: { ebay: 0, depop: 0, vinted: 0 }, realized: 0 };
      for (const unit of item.units || []) {
        const key = item.id + ':' + unit.n;
        const cost = alloc.basis[key] || 0;
        t.totalUnits++; row.units++; row.cost += cost;
        if (unit.status === 'sold') { t.soldUnits++; t.moneyOut += num(unit.sale && unit.sale.price); }
        if (isClosed(unit)) { const r = realizedFor(unit); t.realized += r; row.realized += r; continue; }
        t.openUnits++; row.open++;
        for (const k of PLATFORMS) {
          const n = netFor(platformEst(item, k, settings), k, settings.fees, cost, shipping, { boost: k === 'depop' && opts.boost });
          t.unrealized[k] += n; row.net[k] += n;
        }
      }
      row.cost = round2(row.cost); row.realized = round2(row.realized);
      for (const k of PLATFORMS) row.net[k] = round2(row.net[k]);
      t.perItem[item.id] = row;
    }
    for (const k of PLATFORMS) t.unrealized[k] = round2(t.unrealized[k]);
    t.realized = round2(t.realized); t.moneyOut = round2(t.moneyOut);
    t.sellThrough = t.totalUnits ? t.soldUnits / t.totalUnits : 0;
    return t;
  }

  function allTotals(bags, itemsByBag, settings, opts) {
    const t = { unrealized: { ebay: 0, depop: 0, vinted: 0 }, realized: 0, moneyIn: 0, moneyOut: 0, soldUnits: 0, totalUnits: 0, perBag: {} };
    for (const bag of bags) {
      const b = bagTotals(bag, itemsByBag[bag.id] || [], settings, opts);
      t.perBag[bag.id] = b;
      for (const k of PLATFORMS) t.unrealized[k] += b.unrealized[k];
      t.realized += b.realized; t.moneyIn += b.moneyIn; t.moneyOut += b.moneyOut;
      t.soldUnits += b.soldUnits; t.totalUnits += b.totalUnits;
    }
    for (const k of PLATFORMS) t.unrealized[k] = round2(t.unrealized[k]);
    t.realized = round2(t.realized); t.moneyIn = round2(t.moneyIn); t.moneyOut = round2(t.moneyOut);
    t.sellThrough = t.totalUnits ? t.soldUnits / t.totalUnits : 0;
    return t;
  }

  /* ---------- listing text (§6) ---------- */

  function truncateTitle(s, max) {
    max = max || 80;
    s = String(s || '').replace(/\s+/g, ' ').trim();
    if (s.length <= max) return s;
    let cut = s.slice(0, max + 1);
    const sp = cut.lastIndexOf(' ');
    cut = sp > max * 0.5 ? cut.slice(0, sp) : s.slice(0, max);
    return cut.replace(/[\s,;:/|&+-]+$/, '');
  }

  function normalizeTags(tags, max) {
    max = max == null ? 5 : max;
    const out = [];
    for (const t of Array.isArray(tags) ? tags : []) {
      const clean = String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      if (clean && !out.includes(clean)) out.push(clean);
      if (out.length >= max) break;
    }
    return out.map((t) => '#' + t);
  }

  /** Remove every sentence that makes an authenticity claim. */
  function filterBanned(text) {
    const removed = [];
    const lines = String(text || '').split('\n').map((line) => {
      if (!BANNED_RE.test(line)) return line;
      const parts = line.split(/(?<=[.!?])\s+/);
      const kept = parts.filter((p) => { if (BANNED_RE.test(p)) { removed.push(p); return false; } return true; });
      return kept.length ? kept.join(' ') : null;
    }).filter((l) => l !== null);
    return { text: lines.join('\n').replace(/\n{3,}/g, '\n\n').trim(), removed };
  }

  /** Titles are phrases, not sentences: strip the words instead. */
  function filterBannedPhrase(s) {
    const removed = [];
    const out = String(s || '').replace(BANNED_RE_G, (m) => { removed.push(m); return ''; })
      .replace(/\s{2,}/g, ' ').replace(/^[\s,-]+|[\s,-]+$/g, '').trim();
    return { text: out, removed };
  }

  function availableCount(item) {
    return (item.units || []).filter((u) => !isClosed(u)).length;
  }

  function descriptionBody(item, opts) {
    const unitSizes = (item.units || []).map((u) => u.size).filter(Boolean);
    const multi = (item.units || []).length > 1 && unitSizes.length > 1;
    const size = multi ? [...new Set(unitSizes)].join(' / ') : (item.size || unitSizes.join(' / '));
    const bullets = [];
    if (item.brand) bullets.push('Brand: ' + item.brand);
    if (size) bullets.push('Size: ' + size);
    if (item.color) bullets.push('Color: ' + item.color);
    if (item.material) bullets.push('Material: ' + item.material);
    if (item.measurements) bullets.push('Measurements: ' + item.measurements);
    if (item.condition) bullets.push('Condition: ' + item.condition);
    if (item.retailNote) bullets.push(/^retail\b/i.test(item.retailNote) ? item.retailNote : 'Retail: ' + item.retailNote);
    if ((item.units || []).length > 1) bullets.push(availableCount(item) + ' available' + (unitSizes.length ? ' (' + unitSizes.join(', ') + ')' : ''));
    const parts = [];
    if (opts && opts.firstLine) parts.push(opts.firstLine);
    if (item.blurb) parts.push(item.blurb);
    parts.push(bullets.map((b) => '• ' + b).join('\n'));
    parts.push('See all photos for details and condition. Reasonable offers welcome.');
    return parts.filter(Boolean).join('\n\n');
  }

  function buildListing(item, platform, settings) {
    const removed = [];
    const out = { platform, title: '', titleMax: platform === 'ebay' ? 80 : 100, body: '', price: platformListPrice(item, platform, settings), hashtags: [] };
    if (platform === 'ebay' || platform === 'vinted') {
      const raw = (item.titles && item.titles[platform]) || [item.brand, item.name, item.size].filter(Boolean).join(' ');
      const f = filterBannedPhrase(raw);
      removed.push(...f.removed);
      out.title = truncateTitle(f.text, out.titleMax);
      out.body = descriptionBody(item);
    } else {
      out.hashtags = normalizeTags(item.tags, 5);
      out.body = descriptionBody(item, { firstLine: item.depopFirstLine || [item.brand, item.name].filter(Boolean).join(' ') });
    }
    const fb = filterBanned(out.body);
    removed.push(...fb.removed);
    out.body = fb.text;
    if (out.hashtags.length) out.body += '\n\n' + out.hashtags.join(' ');
    out.removed = removed;
    return out;
  }

  const STOP = new Set(['the', 'a', 'an', 'and', 'with', 'of', 'in', 'for', 'nwt', 'new', 'tags', 'womens', "women's", 'size']);
  function compsUrl(item) {
    const brand = String(item.brand || '').trim();
    const brandWords = new Set(brand.toLowerCase().split(/\s+/));
    const terms = String(item.name || '').replace(/[^\p{L}\p{N}\s-]/gu, ' ').split(/\s+/)
      .filter((w) => w && !brandWords.has(w.toLowerCase()) && !STOP.has(w.toLowerCase())).slice(0, 4);
    const size = String(item.size || '').split(/[\/(,]/)[0].trim();
    const q = [brand].concat(terms).concat(size ? [size] : []).join(' ').replace(/\s+/g, ' ').trim();
    return 'https://www.ebay.com/sch/i.html?_nkw=' + encodeURIComponent(q) + '&LH_Sold=1&LH_Complete=1';
  }

  function needsInfo(item) {
    const locked = new Set(item.locked || []);
    return (item.uncertain || []).filter((f) => !locked.has(f));
  }

  /* ---------- AI result validation (§5) ---------- */

  const isStr = (v) => typeof v === 'string';
  const optStr = (v) => (v == null || v === '' ? null : (isStr(v) ? v.trim() : String(v)));
  const toInt = (v) => (Number.isInteger(Number(v)) ? Number(v) : NaN);

  function validateCaptions(obj, expected) {
    const errors = [];
    const arr = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.captions) ? obj.captions : null);
    if (!arr) return { ok: false, errors: ['Expected a list of captions.'] };
    const want = new Set(expected);
    const seen = new Map();
    for (const c of arr) {
      if (!c || typeof c !== 'object') continue;
      const n = toInt(c.n);
      if (!want.has(n)) { errors.push('Unexpected photo number ' + c.n); continue; }
      seen.set(n, {
        n,
        garment: String(c.garment || '').slice(0, 200),
        color: String(c.color || '').slice(0, 80),
        brandVisible: optStr(c.brandVisible),
        view: VIEWS.includes(c.view) ? c.view : 'other',
        sizeText: optStr(c.sizeText),
        notableDetails: Array.isArray(c.notableDetails) ? c.notableDetails.map(String).slice(0, 10) : [],
        legible: !!c.legible
      });
    }
    const missing = expected.filter((n) => !seen.has(n));
    if (seen.size === 0) return { ok: false, errors: errors.concat(['No usable captions.']) };
    return { ok: true, errors, captions: [...seen.values()], missing };
  }

  function validateGrouping(obj, validNumbers) {
    const errors = [];
    if (!obj || !Array.isArray(obj.items)) return { ok: false, errors: ['Expected {items: [...]}.'] };
    const valid = new Set(validNumbers);
    const items = [];
    const used = new Set();
    obj.items.forEach((g, i) => {
      if (!g || !Array.isArray(g.photoNumbers)) { errors.push('Group ' + i + ' has no photoNumbers'); return; }
      const nums = [...new Set(g.photoNumbers.map(toInt).filter((n) => valid.has(n)))];
      if (!nums.length) { errors.push('Group ' + i + ' has no valid photos'); return; }
      let qty = toInt(g.qty == null ? 1 : g.qty);
      if (!(qty >= 1 && qty <= 50)) { errors.push('Group ' + i + ' qty out of range'); qty = 1; }
      let sizes = Array.isArray(g.perUnitSizes) ? g.perUnitSizes.map((s) => String(s || '').trim()) : null;
      if (sizes && sizes.length !== qty) sizes = null;
      nums.forEach((n) => used.add(n));
      items.push({ tempId: String(g.tempId || 'g' + (i + 1)), photoNumbers: nums.sort((a, b) => a - b), qty, perUnitSizes: sizes, reason: String(g.reason || '').slice(0, 300) });
    });
    if (!items.length) return { ok: false, errors: errors.concat(['No groups returned.']) };
    const unassigned = validNumbers.filter((n) => !used.has(n));
    return { ok: true, errors, items, unassigned };
  }

  /** Merge groups from overlapping windows: groups from different windows that share a photo become one. */
  function mergeWindows(windowResults) {
    const groups = [];
    windowResults.forEach((w, wi) => (w.items || []).forEach((g) => groups.push(Object.assign({ w: wi }, g))));
    const parent = groups.map((_, i) => i);
    const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
    const owner = new Map();
    groups.forEach((g, i) => g.photoNumbers.forEach((n) => {
      for (const j of owner.get(n) || []) if (groups[j].w !== g.w) parent[find(i)] = find(j);
      owner.set(n, (owner.get(n) || []).concat(i));
    }));
    const merged = new Map();
    groups.forEach((g, i) => {
      const r = find(i);
      const m = merged.get(r);
      if (!m) merged.set(r, { tempId: g.tempId, photoNumbers: g.photoNumbers.slice(), qty: g.qty, perUnitSizes: g.perUnitSizes, reason: g.reason });
      else {
        m.photoNumbers = [...new Set(m.photoNumbers.concat(g.photoNumbers))].sort((a, b) => a - b);
        if (g.qty > m.qty) { m.qty = g.qty; m.perUnitSizes = g.perUnitSizes; }
      }
    });
    const out = [...merged.values()].sort((a, b) => a.photoNumbers[0] - b.photoNumbers[0]);
    return out;
  }

  function windowsFor(numbers, size, overlap) {
    if (numbers.length <= size) return [numbers.slice()];
    const out = [];
    const step = size - overlap;
    for (let i = 0; i < numbers.length; i += step) {
      out.push(numbers.slice(i, i + size));
      if (i + size >= numbers.length) break;
    }
    return out;
  }

  const PLATFORM_ALIASES = { ebay: 'ebay', 'e-bay': 'ebay', depop: 'depop', vinted: 'vinted' };
  const CONFIDENCE = { low: 'low', med: 'med', medium: 'med', high: 'high' };
  const UNCERTAIN_ALIASES = { title: 'titles.ebay', titles: 'titles.ebay', ebayTitle: 'titles.ebay', vintedTitle: 'titles.vinted', price: 'estSale', description: 'blurb', hashtags: 'tags' };

  function validateAnalysis(o) {
    const errors = [];
    if (!o || typeof o !== 'object' || Array.isArray(o)) return { ok: false, errors: ['Expected one JSON object.'] };
    const v = {};
    for (const f of ['brand', 'name', 'category', 'size', 'color', 'material', 'condition', 'blurb', 'depopFirstLine', 'priceReasoning']) {
      if (o[f] == null) { v[f] = ''; continue; }
      if (!isStr(o[f])) { errors.push(f + ' must be text'); continue; }
      v[f] = o[f].trim();
    }
    if (!v.name) errors.push('name is required');
    if ((v.name || '').length > 200) errors.push('name is too long');
    if ((v.blurb || '').length > 3000) errors.push('description is too long');
    for (const f of ['measurements', 'retailNote', 'styleCode']) v[f] = optStr(o[f]);
    const t = o.titles;
    if (!t || !isStr(t.ebay) || !t.ebay.trim()) errors.push('titles.ebay is required');
    else if (t.ebay.length > 160) errors.push('eBay title is ' + t.ebay.length + ' characters');
    if (t && t.vinted != null && !isStr(t.vinted)) errors.push('titles.vinted must be text');
    if (t && isStr(t.ebay)) {
      const clean = t.ebay.replace(/\s+/g, ' ').trim();
      v.titles = { ebay: truncateTitle(clean, 80), vinted: truncateTitle(String(t.vinted || clean), 100) };
      v.titleTruncated = clean.length > 80;
    }
    v.tags = Array.isArray(o.tags) ? o.tags.map(String).slice(0, 30) : [];
    for (const f of ['listPrice', 'estSale']) {
      const n = Number(o[f]);
      if (!Number.isFinite(n) || n < 0 || n > 100000) errors.push(f + ' is out of range');
      else v[f] = Math.round(n);
    }
    if (v.estSale === 0) errors.push('estSale must be above zero');
    v.priceConfidence = CONFIDENCE[String(o.priceConfidence || '').toLowerCase()] || 'low';
    const bp = String(o.bestPlatform || '').toLowerCase().trim();
    v.bestPlatform = PLATFORM_ALIASES[bp] || (bp.includes('ebay') ? 'ebay' : bp.includes('depop') ? 'depop' : bp.includes('vinted') ? 'vinted' : 'ebay');
    v.sellerNotes = Array.isArray(o.sellerNotes) ? o.sellerNotes.map(String).filter(Boolean).slice(0, 8) : [];
    const unc = new Set();
    for (const f of Array.isArray(o.uncertain) ? o.uncertain : []) {
      const key = UNCERTAIN_ALIASES[f] || f;
      if (ANALYSIS_FIELDS.includes(key)) unc.add(key);
    }
    // Condition stays uncertain unless the item is new with tags (§5, §11).
    if (!/\b(new with tags|nwt)\b/i.test(v.condition || '')) unc.add('condition');
    for (const f of ['size', 'material', 'brand']) if (!v[f]) unc.add(f);
    v.uncertain = [...unc];
    if (errors.length) return { ok: false, errors };
    return { ok: true, errors: [], value: v };
  }

  function getField(item, f) {
    if (f.startsWith('titles.')) return (item.titles || {})[f.slice(7)];
    return item[f];
  }

  /**
   * Merge a validated analysis into an item, skipping locked fields.
   * Returns {patch, changes}. patch is suitable for a db update.
   */
  function applyAnalysis(item, v) {
    const locked = new Set(item.locked || []);
    const patch = {};
    const changes = [];
    for (const f of ANALYSIS_FIELDS) {
      if (locked.has(f)) continue;
      const to = getField(v, f);
      const from = getField(item, f);
      if (JSON.stringify(to ?? null) !== JSON.stringify(from ?? null)) changes.push({ field: f, from: from ?? null, to: to ?? null });
      if (f.startsWith('titles.')) { patch.titles = patch.titles || Object.assign({}, item.titles || {}); patch.titles[f.slice(7)] = to; }
      else patch[f] = to ?? null;
    }
    if (!locked.has('titles.ebay')) patch.titleTruncated = !!v.titleTruncated;
    patch.uncertain = (v.uncertain || []).filter((f) => !locked.has(f));
    return { patch, changes };
  }

  /** Pick photos for item analysis: tags and labels first, then garment views. */
  function choosePhotos(photos, max) {

/* One write at a time per document. */
const writeQueue = new Map();
function write(ref, op, data) {
  const key = ref.path;
  const prev = writeQueue.get(key) || Promise.resolve();
  const p = prev.catch(() => {}).then(() => (op === 'set' ? ref.set(data) : op === 'update' ? ref.update(data) : ref.delete()));
  writeQueue.set(key, p);
  const clean = () => { if (writeQueue.get(key) === p) writeQueue.delete(key); };
  p.then(clean, clean);
  return p.catch((e) => { dbError(e); throw e; });
}
function dbError(e) {
  const code = e && e.code;

  else if (code === 'resource_exhausted') toast('Too many changes at once. Wait a moment and try again.', 4000);
  else toast('Could not save on this device. Free up some storage and try again.', 5000);
  console.warn('db write failed', e);
}
/** Run db writes with limited concurrency. */
async function writeMany(tasks, limit) {
  let i = 0;
  const worker = async () => { while (i < tasks.length) { const t = tasks[i++]; await t(); } };
  await Promise.all(Array.from({ length: Math.min(limit || 4, tasks.length) }, worker));

const extOf = (name) => (String(name || '').toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || '';
const isZipFile = (f, n) => f.type === 'application/zip' || f.type === 'application/x-zip-compressed' || extOf(n) === 'zip';
const isPdfFile = (f, n) => f.type === 'application/pdf' || extOf(n) === 'pdf';
const isHeicFile = (f, n) => /hei[cf]/.test(f.type) || ['heic', 'heif'].includes(extOf(n));
const isImageFile = (f, n) => /^image\//.test(f.type) || ['jpg', 'jpeg', 'png', 'webp', 'heic', 'heif', 'gif'].includes(extOf(n));
const MIME_BY_EXT = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', heic: 'image/heic', heif: 'image/heif', gif: 'image/gif', pdf: 'application/pdf', zip: 'application/zip' };

async function pdfLib() {
  // The worker script is loaded as a plain script so pdf.js runs in the main thread;
  // the CSP does not allow a cross-origin Worker.
  await loadScript(LIBS.pdfWorker);
  await loadScript(LIBS.pdf);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  return lib;
}

/** Open a PDF without reading the whole file into memory (a 200 MB PDF on an iPhone). */
async function openPdf(file) {
  const lib = await pdfLib();
  const opts = { canvasMaxAreaInBytes: 4096 * 4096 * 4, isEvalSupported: false, disableFontFace: true, verbosity: 0 };
  try {
    const head = new Uint8Array(await file.slice(0, Math.min(file.size, 1 << 16)).arrayBuffer());
    const transport = new lib.PDFDataRangeTransport(file.size, head);
    transport.requestDataRange = (begin, end) => {
      file.slice(begin, end).arrayBuffer().then((buf) => transport.onDataRange(begin, new Uint8Array(buf)));
    };
    return await lib.getDocument(Object.assign({ range: transport, length: file.size, rangeChunkSize: 1 << 20, disableAutoFetch: true, disableStream: true }, opts)).promise;
  } catch (e) {
    devLog('range loading failed, reading whole PDF', e);
    return await lib.getDocument(Object.assign({ data: new Uint8Array(await file.arrayBuffer()) }, opts)).promise;
  }
}

/** Yields {blob,name} | {pdf,page,name} | {error,name} lazily so memory stays low. */
async function* expandInput(file, name) {
  name = name || file.name || 'file';
  try {
    if (isZipFile(file, name)) {
      await loadScript(LIBS.jszip);
      const zip = await window.JSZip.loadAsync(file);
      const entries = Object.values(zip.files).filter((e) => !e.dir && !/(^|\/)(__MACOSX|\.)/.test(e.name))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      for (const entry of entries) {
        const blob = await entry.async('blob');
        const short = entry.name.split('/').pop();
        const typed = new File([blob], short, { type: MIME_BY_EXT[extOf(short)] || '' });
        yield* expandInput(typed, name + ' › ' + short);
      }
    } else if (isPdfFile(file, name)) {
      const pdf = await openPdf(file);
      try { for (let p = 1; p <= pdf.numPages; p++) yield { pdf, page: p, name, size: file.size }; }
      finally { pdf.destroy(); }
    } else if (isImageFile(file, name)) {
      yield { blob: file, name, size: file.size };
    } else {
      yield { error: 'not a photo, PDF or ZIP', name };
    }
  } catch (e) {
    yield { error: 'could not be opened', name };
  }
}

async function countInputs(files) {
  let n = 0;
  for (const f of files) {
    try {
      if (isPdfFile(f, f.name)) { const pdf = await openPdf(f); n += pdf.numPages; pdf.destroy(); }
      else if (isZipFile(f, f.name)) { await loadScript(LIBS.jszip); const z = await window.JSZip.loadAsync(f); n += Object.values(z.files).filter((e) => !e.dir).length; }
      else n += 1;
    } catch (e) { n += 1; }
  }
  return n;
}

function imageDims(blob) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { const d = { w: img.naturalWidth, h: img.naturalHeight, img, url }; resolve(d.w ? d : null); };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

async function heicToJpeg(blob) {
  await loadScript(LIBS.heic);
  const out = await window.heic2any({ blob, toType: 'image/jpeg', quality: 0.92 });
  return Array.isArray(out) ? out[0] : out;
}

const canvasOf = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
