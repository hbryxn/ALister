<title>ALister</title>
<meta name="description" content="Turn a pile of clothing photos into eBay, Depop and Vinted listings, then track every piece to sold.">

<style>
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url("fonts/public-sans-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url("fonts/public-sans-600.woff2") format("woff2"); font-weight: 500 600; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url("fonts/public-sans-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one narrow working column (max 1080px) under a sticky bar; cards only where an object is a real thing (a bag, an item). */
:root {
  --bg: #e9e6ef;          /* cool lilac-grey ground */
  --surface: #f7f6fa;
  --surface-2: #efedf4;
  --ink: #231f2b;
  --muted: #655e73;
  --line: #d6d1df;
  --plum: #6a2c5b;
  --plum-soft: #f0e3ec;
  --on-plum: #ffffff;
  --manila: #e6d2a2;
  --manila-ink: #3a2e14;
  --ok: #2c7049;
  --ok-soft: #dfeee4;
  --warn: #93590f;
  --warn-soft: #f6e9d2;
  --bad: #a3271f;
  --bad-soft: #f7dfdc;
  --shadow: 0 1px 2px rgba(35, 31, 43, .06), 0 4px 14px rgba(35, 31, 43, .06);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16141b; --surface: #201d27; --surface-2: #29252f; --ink: #ece9f1; --muted: #a49db0; --line: #37323f;
    --plum: #d79cc7; --plum-soft: #3b2536; --on-plum: #2a0f22; --manila: #c9b17b; --manila-ink: #2d230e;
    --ok: #79c495; --ok-soft: #1f3327; --warn: #e0ad62; --warn-soft: #3a2d17; --bad: #f08c82; --bad-soft: #3d1f1d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16141b; --surface: #201d27; --surface-2: #29252f; --ink: #ece9f1; --muted: #a49db0; --line: #37323f;
  --plum: #d79cc7; --plum-soft: #3b2536; --on-plum: #2a0f22; --manila: #c9b17b; --manila-ink: #2d230e;
  --ok: #79c495; --ok-soft: #1f3327; --warn: #e0ad62; --warn-soft: #3a2d17; --bad: #f08c82; --bad-soft: #3d1f1d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--plum); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; } /* keeps iOS from zooming */
:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1080px; margin: 0 auto; padding: 8px var(--gutter); display: flex; align-items: center; gap: 8px; min-height: 56px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 0; cursor: pointer; }
.brand .tag-mini { width: 22px; height: 14px; background: var(--manila); clip-path: polygon(6px 0, 100% 0, 100% 100%, 6px 100%, 0 50%); }
.bar nav { margin-left: auto; display: flex; gap: 4px; }

main { max-width: 1080px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 20px 120px; display: flex; flex-direction: column; gap: 20px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--plum); border-color: var(--plum); color: var(--on-plum); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: .88rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.copied { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.icon-btn { min-width: 44px; min-height: 44px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; font-size: 1.2rem; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.panel { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.notice { border-radius: var(--r); padding: 12px 14px; background: var(--surface-2); display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.notice.warn { background: var(--warn-soft); color: var(--ink); }
.notice.bad { background: var(--bad-soft); }
.notice.ok { background: var(--ok-soft); }
.notice p { flex: 1 1 260px; min-width: 0; }

/* chips and pills */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.plum { background: var(--plum-soft); color: var(--plum); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
button.chip { border: 0; cursor: pointer; min-height: 28px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 600; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; min-height: 38px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* hang-tag price: the one signature element */
.hangtag { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 84px;
  padding: 6px 14px 6px 26px; background: var(--manila); color: var(--manila-ink);
  clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%); border-radius: 0 6px 6px 0; }
.hangtag::before { content: ""; position: absolute; left: 13px; top: 50%; width: 8px; height: 8px; border-radius: 50%; transform: translate(-50%, -50%);
  background: var(--surface); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--manila-ink) 30%, transparent); }
.hangtag .p { font-family: var(--display); font-weight: 800; font-size: 1.35rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hangtag .l { font-size: .7rem; font-weight: 600; opacity: .75; }
.hangtag.sm { min-width: 0; padding: 3px 10px 3px 20px; }
.hangtag.sm::before { left: 10px; width: 6px; height: 6px; }
.hangtag.sm .p { font-size: 1rem; }

/* totals strip */
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.totals > div { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.totals .k { font-size: .8rem; color: var(--muted); font-weight: 600; }
.totals .v { font-family: var(--display); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.totals .v.neg { color: var(--bad); }
.totals .v.pos { color: var(--ok); }

/* bag list */
.bags { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.bag-card { text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px; color: var(--ink); }
.bag-card:hover { border-color: var(--muted); }
.bag-thumbs { display: flex; gap: 4px; height: 64px; overflow: hidden; }
.bag-thumbs img, .bag-thumbs span { width: 48px; height: 64px; object-fit: cover; border-radius: 4px; background: var(--surface-2); flex: none; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { display: flex; flex-direction: column; min-width: 0; }
.kv .k { font-size: .75rem; color: var(--muted); }
.kv .v { font-weight: 700; font-variant-numeric: tabular-nums; }

/* empty state */
.empty { text-align: left; padding: 28px 20px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.steps3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.steps3 > div { background: var(--surface-2); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.steps3 b { font-family: var(--display); font-size: 1.05rem; }

/* forms */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lab { font-size: .85rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); width: 100%; }
.field textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--plum); }

/* drop zone */
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; background: var(--surface); }
.drop.over { border-color: var(--plum); background: var(--plum-soft); }
.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--plum); transition: width .3s; }
.meter > i { background: var(--ok); }
.meter.full > i { background: var(--bad); }

/* photo grid */
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.thumb { position: relative; aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; background: var(--surface-2); border: 0; padding: 0; cursor: pointer; max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .n { position: absolute; left: 3px; top: 3px; background: var(--ink); color: var(--bg); font-size: .7rem; font-weight: 700; padding: 0 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.thumb .v { position: absolute; left: 3px; bottom: 3px; background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--ink); font-size: .65rem; padding: 0 5px; border-radius: 4px; }
.thumb .flag { position: absolute; right: 3px; top: 3px; background: var(--warn); color: var(--surface); font-size: .65rem; font-weight: 700; padding: 0 5px; border-radius: 4px; }
.thumb .cover { position: absolute; right: 3px; bottom: 3px; background: var(--manila); color: var(--manila-ink); font-size: .65rem; font-weight: 700; padding: 0 5px; border-radius: 4px; }
.thumb[aria-pressed="true"] { outline: 3px solid var(--plum); outline-offset: -3px; }
.thumb[aria-pressed="true"]::after { content: "✓"; position: absolute; right: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--plum); color: var(--on-plum); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.thumb.excluded img { opacity: .35; filter: grayscale(1); }

/* review groups */
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group.drop-target { outline: 2px dashed var(--plum); outline-offset: 2px; }
.group h3 { font-size: 1rem; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; }
.stepper button { min-width: 40px; min-height: 40px; border: 0; background: transparent; cursor: pointer; font-size: 1.1rem; }
.stepper span { min-width: 2ch; text-align: center; font-weight: 700; }
.sizes { display: flex; gap: 6px; flex-wrap: wrap; }
.sizes input { width: 80px; min-height: 40px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

/* sticky action dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.dock-in { max-width: 1080px; margin: 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.dock-in .grow { font-weight: 600; }

/* run progress */
.runlist { display: flex; flex-direction: column; gap: 2px; }
.runlist > div { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); min-height: 44px; }
.runlist .st { width: 74px; flex: none; }
.stream { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .78rem; color: var(--muted); max-height: 4.5em; overflow: hidden; white-space: pre-wrap; word-break: break-word; }

/* listings */
.items { display: flex; flex-direction: column; gap: 14px; }
.item { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; }
.item .cover-img { width: 120px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: var(--surface-2); display: block; max-width: 100%; }
.item-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.item-head .t { min-width: 0; flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px; }
.brandline { font-size: .8rem; font-weight: 700; color: var(--plum); letter-spacing: .02em; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.facts button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 4px 8px; min-height: 32px; cursor: pointer; font-size: .85rem; text-align: left; }
.facts button.unc { border-color: var(--warn); background: var(--warn-soft); }
.facts button .k { color: var(--muted); margin-right: 4px; }
.copyrow { display: flex; flex-direction: column; gap: 6px; }
.copyrow .lab { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: .8rem; font-weight: 600; color: var(--muted); }
.titlebox { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); cursor: text; text-align: left; width: 100%; font-weight: 600; min-height: 44px; }
.descbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface-2); max-height: 180px; overflow: auto; white-space: pre-wrap; font-size: .88rem; line-height: 1.45; }
.counter.over { color: var(--bad); font-weight: 700; }
.notes { margin: 0; padding: 10px 12px 10px 28px; background: var(--warn-soft); border-radius: 8px; font-size: .88rem; }
.notes li + li { margin-top: 4px; }
.units { display: flex; flex-direction: column; gap: 6px; }
.unit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid var(--line); }
.unit select { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: 100%; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; min-width: 210px; display: flex; flex-direction: column; }
.menu-list button { text-align: left; border: 0; background: transparent; min-height: 44px; padding: 0 12px; border-radius: 6px; cursor: pointer; }
.menu-list button:hover { background: var(--surface-2); }

/* profit table → cards on phones */
.ptable { width: 100%; border-collapse: collapse; font-size: .9rem; }
.ptable th { text-align: right; font-size: .78rem; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line); }
.ptable td { text-align: right; padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.ptable th:first-child, .ptable td:first-child { text-align: left; }
.ptable td.neg { color: var(--bad); }
@media (max-width: 640px) {
  .ptable thead { display: none; }
  .ptable, .ptable tbody, .ptable tr, .ptable td { display: block; width: 100%; }
  .ptable tr { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; }
  .ptable td { border: 0; padding: 2px 0; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
  .ptable td::before { content: attr(data-label); color: var(--muted); font-size: .78rem; }
  .ptable td:first-child { grid-column: 1 / -1; font-weight: 700; }
  .ptable td:first-child::before { content: none; }
  .item { grid-template-columns: 76px minmax(0, 1fr); gap: 12px; }
  .item .cover-img { width: 76px; }
  .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  h1 { font-size: 1.45rem; }
}

/* sheet (modal) */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(20, 16, 26, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 16px 16px 0 0;
  padding: 20px var(--gutter) calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 16px; } }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.diff { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.diff > div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .88rem; }
.diff del { color: var(--bad); text-decoration: line-through; display: block; }
.diff ins { color: var(--ok); text-decoration: none; display: block; }
.picklist { display: flex; flex-direction: column; gap: 4px; }
.picklist button { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-height: 52px; cursor: pointer; }
.picklist img { width: 32px; height: 42px; object-fit: cover; border-radius: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.loading { padding: 48px 0; text-align: center; color: var(--muted); }
details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
main > .btn, main > form > .row > .btn { align-self: flex-start; }

  // src/app/views/BagView.js
  var BagView = class _BagView extends View {
    constructor(app2) {
      super(app2);
      this.tabs = { photos: new PhotosTab(app2), review: new ReviewTab(app2), listings: new ListingsTab(app2), profit: new ProfitTab(app2) };
    }
    static defaultTab(bag) {
      if (bag.status === "review") return "review";
      if (bag.status === "analyzing" || bag.status === "ready") return "listings";
      return "photos";
    }
    currentTab(bag) {
      return this.ui.route.tab || _BagView.defaultTab(bag);
    }
    html() {
      const store = this.store;
      const bag = store.currentBag();
      if (!store.bagsLoaded) return '<div class="loading">Loading\u2026</div>';
      if (!bag) return `<button class="btn ghost small" data-act="nav" data-to="home">\u2190 Inventory</button><p>This bag was deleted.</p>`;
      const tab = this.currentTab(bag);
      const items = store.bagItems(bag.id);
      const nPhotos = store.photosLoaded ? store.photos.size : bag.photoCount || 0;
      const tabs = [["photos", "Photos", nPhotos], ["review", "Review", items.length], ["listings", "Listings", null], ["profit", "Profit", null]];
      const content = (this.tabs[tab] || this.tabs.profit).html(bag, items);
      return `<button class="btn ghost small" data-act="nav" data-to="home">\u2190 Inventory</button>
      ${this.capabilityNotices()}
      <div class="spread"><div class="grow"><h1>${esc(bag.name || "Untitled bag")}</h1>
        <p class="muted small">${esc([fmtDate(bag.purchaseDate || bag.createdAt), bag.source, "paid " + money0(bag.purchaseCost)].filter(Boolean).join(" \xB7 "))}
          ${!bag.purchaseCost ? ' <button class="chip warn" data-act="edit-bag">Add what you paid</button>' : ""}</p></div>
        ${store.readOnly ? "" : '<button class="btn small" data-act="edit-bag">Edit bag</button>'}</div>
      ${this.runPanel(bag)}
      <div class="seg" role="tablist">${tabs.map(([k, l, n]) => `<button role="tab" data-act="tab" data-tab="${k}" aria-pressed="${tab === k}">${l}${n != null ? ` <span class="num muted">${n}</span>` : ""}</button>`).join("")}</div>
      ${content}`;
    }
    /** Live progress while Claude works; afterwards, failed steps with retry and the Resume button. */
    runPanel(bag) {
      const store = this.store;
      const active = this.app.pipeline.run;
      const run = active && active.bagId === bag.id && active.kind !== "regen" ? active : null;
      const failed = store.photosBag === bag.id && store.job && store.job.failed || [];
      const msg = this.ui.lastMessage && this.ui.lastMessage.bagId === bag.id ? this.ui.lastMessage : null;
      if (run) {
        const pct = run.total ? Math.round((run.step - 1) / run.total * 100) : 0;
        let list = "";
        if (run.kind === "analyze") {
          const failedIds = new Set(failed.filter((f) => f.pass === 3).map((f) => f.itemId));
          list = `<div class="runlist">${(run.queue || []).map((id) => {
            const it = store.items.get(id);
            if (!it) return "";
            const st = id === run.current ? '<span class="chip plum">Working</span>' : it.analyzedAt ? '<span class="chip ok">Done</span>' : failedIds.has(id) ? '<span class="chip bad">Failed</span>' : '<span class="chip">Queued</span>';
            const name = id === run.current && run.streamName ? run.streamName : [it.brand, it.name].filter(Boolean).join(" ");
            return `<div><span class="st">${st}</span><span class="grow">${esc(name)}</span></div>`;
          }).join("")}</div>`;
        }
        return `<section class="panel stack" aria-live="polite">
        <div class="spread"><h3>${esc(run.label || "Working")}</h3><button class="btn small" data-act="stop-run">Stop</button></div>
        <div class="progress"><i style="width:${Math.max(3, pct)}%"></i></div>
        <p class="small muted">Step ${run.step || 1} of ${run.total || 1}. ${run.stream ? "Claude is writing\u2026" : "Claude is thinking. This can take up to a minute per step."} Progress is saved after every step.</p>
        ${run.stream ? `<div class="stream">${esc(run.stream.slice(-240))}</div>` : ""}
        ${list}
      </section>`;
      }
      const stalled = bag.status === "grouping" || bag.status === "analyzing";
      if (!stalled && !failed.length && !msg) return "";
      const canAnalyze = this.claude.canAnalyze();
      const failRows = failed.map((f) => {
        const it = f.pass === 3 ? store.items.get(f.itemId) : null;
        const what = f.pass === 3 ? it ? [it.brand, it.name].filter(Boolean).join(" ") : "An item" : f.label || "Reading photos " + (f.numbers || []).slice(0, 3).map((n) => "#" + n).join(", ") + ((f.numbers || []).length > 3 ? "\u2026" : "");
        return `<div><span class="st"><span class="chip bad">Failed</span></span><span class="grow">${esc(what)}<br><span class="small muted">${esc(f.message || "")}</span></span>
        ${canAnalyze ? `<button class="btn small" data-act="retry-step" data-key="${esc(f.key)}">Try this step again</button>` : ""}</div>`;
      }).join("");
      const paused = this.ui.paused ? "Paused. Tap Resume to continue." : null;
      return `<section class="panel stack">
      ${stalled ? `<div class="spread"><h3>${bag.status === "grouping" ? "Finding items stopped" : "Writing listings stopped"}</h3>
        ${canAnalyze ? '<button class="btn primary" data-act="resume">Resume analysis</button>' : ""}</div>` : ""}
      ${paused || msg ? `<p>${esc(paused || msg.text)}</p>${msg && msg.detail ? `<p class="small muted">${esc(msg.detail)}</p>` : ""}` : ""}
      ${failRows ? `<div class="runlist">${failRows}</div>` : ""}
      ${this.ui.lastOfferContinue === bag.id ? '<div class="row"><button class="btn" data-act="continue-missing">Continue without them</button></div>' : ""}
    </section>`;
    }
  };

          <option value="never" ${s.complexTier === "never" ? "selected" : ""}>Never (costs less)</option>
          <option value="highValue" ${s.complexTier === "highValue" ? "selected" : ""}>When regenerating high-value items</option>
          <option value="always" ${s.complexTier === "always" ? "selected" : ""}>Always</option></select></div>
        ${this.moneyIn("highValueThreshold", s.highValueThreshold, "High-value means an estimated sale of at least")}
      </div>
      <p class="small muted">If a run stops (no connection, rate limit, out of credit), everything so far is saved and Resume picks up where it stopped.</p>
    </section>
    <section class="panel stack" id="storage">
      <h2>Photo storage</h2>
      ${this.store.assets ? u ? `<div class="progress meter${usePct > 90 ? " full" : ""}"><i style="width:${usePct}%"></i></div>
        <p class="small num">Photos use ${(u.bytes / 1048576).toFixed(0)} MB (${u.files} files). This device lets the app use up to about ${(u.maxBytes / 1073741824).toFixed(1)} GB.</p>
        <p class="small muted">Deleting a bag deletes its photos and frees this space.</p>` : '<p class="small muted">Checking storage\u2026</p>' : ""}
    </section>
    <section class="panel stack">
      <h2>Your data</h2>
      <p class="small muted">Everything lives on this device only. Back up regularly, and use a backup to move your inventory to another computer or phone. Your API key is not included.</p>
      <div class="row"><button class="btn primary" data-act="backup">Back up everything (ZIP)</button><label class="btn" for="restore-in">Restore from backup\u2026</label><button class="btn ghost" data-act="export">View data as JSON</button></div>
      <input id="restore-in" class="sr" type="file" accept=".zip,application/zip">
      <p class="small muted" id="backup-status" aria-live="polite">${esc(this.ui.backupStatus || "")}</p>
    </section>
    <section class="panel stack">
      <h2>About</h2>
      <p class="small">ALister version ${VERSION}</p>
      <ul class="small">${WHATS_NEW.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>
      <p class="small muted">Prices are Claude's estimates, not live comps; use each item's sold-prices link to check. Claude can misread small tags, which is why fields from blurry photos are marked Needs info. Listings never claim authenticity; that is the seller's responsibility.</p>
    </section>`;
    }
  };

  // src/app/views/WelcomeView.js
  var WelcomeView = class extends View {
    html() {
      const sample = this.claude.sample;
      return `<section class="panel empty">
      <h1>ALister</h1>
      <p class="muted">Turn a bag of clothing photos into listings for eBay, Depop and Vinted, then track every piece until it sells.</p>
      <div class="steps3">
        ${sample && sample.viaClaude ? "<div><b>1. Signed in with Claude</b><span>Claude reads the photos on your own Claude plan. No API key needed.</span></div>" : `<div><b>1. Connect Claude</b><span>Add your own Anthropic API key (you pay Anthropic for what you use), or ${View.claudeAccountLink("")} with no key.</span></div>`}
        <div><b>2. Drop your photos</b><span>A whole pile at once: camera roll shots, a folder, a PDF of photos, or a ZIP. Claude finds every item and writes the listings.</span></div>
        <div><b>3. Copy listings</b><span>Copy each title, description and price into eBay, Depop or Vinted. Mark pieces listed and sold to track profit.</span></div>
      </div>
      <p class="small muted">Everything stays on this device. Prices are Claude's estimates, not live sold prices; each item links to eBay sold listings so you can check. The app never claims an item is authentic; that's up to you as the seller.</p>
      <div class="row"><button class="btn primary" data-act="welcome-done">Get started</button></div>
    </section>`;
    }
  };

  // src/app/views/Renderer.js
  var Renderer = class extends AppPart {
    constructor(app2) {
      super(app2);
      this.views = { home: new HomeView(app2), welcome: new WelcomeView(app2), newbag: new NewBagView(app2), bag: new BagView(app2), settings: new SettingsView(app2) };
      this.queued = false;
      this.pending = false;
      document.addEventListener("focusout", () => {
        if (this.pending) {
          this.pending = false;
          setTimeout(() => this.render(), 0);
        }
      });
    }
    render() {
      if (this.queued) return;
      this.queued = true;
      const run = () => {
        if (!this.queued) return;
        this.queued = false;
        this.paint();
      };
      requestAnimationFrame(run);
      setTimeout(run, 60);
    }
    paint() {
      const main = $("#main");
      const a = document.activeElement;
      if (a && main.contains(a) && a.matches("input[type=text], input[type=password], input[type=number], input[type=date], input:not([type]), textarea")) {
        this.pending = true;
        return;
      }
      $("#nav").innerHTML = this.nav();
      main.innerHTML = this.view();
      const dock = $("#dock");
      dock.innerHTML = this.dock();
      dock.hidden = !dock.innerHTML.trim();
      const ui = this.ui;
      if (ui.focusItem) {
        const el = document.getElementById("item-" + ui.focusItem);
        if (el) {
          el.scrollIntoView({ block: "start" });
          ui.focusItem = null;
        }
      }
    }
    nav() {
      if (!this.ui.booted || !this.store.db || !this.store.uid) return "";
      const v = this.ui.route.view;
      return `<button class="btn ghost small" data-act="nav" data-to="home" aria-current="${v === "home" || v === "bag" ? "page" : "false"}">Inventory</button>
      <button class="btn ghost small" data-act="nav" data-to="settings" aria-current="${v === "settings" ? "page" : "false"}">Settings</button>`;
    }
    view() {
      const ui = this.ui, store = this.store;
      if (!ui.booted) return '<div class="loading">Loading your inventory\u2026</div>';
      if (ui.bootError || !store.db) return `<div class="notice bad"><p><b>ALister couldn't open its storage on this device.</b> ${esc(ui.bootError || "")} Private or incognito windows often block storage; open it in a normal window.</p></div>`;
      if (store.settingsExists === null) return '<div class="loading">Loading your inventory\u2026</div>';
      if (store.settingsExists === false) return this.views.welcome.html();
      const v = this.views[ui.route.view];
      return (v && ui.route.view !== "welcome" ? v : this.views.home).html();
    }
    /** The sticky bottom bar on the Review tab: selection actions, or the next pipeline step. */
    dock() {
      const ui = this.ui, store = this.store;
      if (ui.route.view !== "bag") return "";
      const bag = store.currentBag();
      if (!bag || store.readOnly) return "";
      if (this.views.bag.currentTab(bag) !== "review") return "";
      if (ui.sel.length) {
        const fromExcluded = ui.sel.every((s) => s.from === "x");
        const oneInGroup = ui.sel.length === 1 && ui.sel[0].from && ui.sel[0].from !== "x";
        return `<div class="dock-in"><span class="grow">${ui.sel.length} selected</span>
        ${fromExcluded ? '<button class="btn" data-act="restore">Restore</button>' : `<button class="btn primary" data-act="move">Move to\u2026</button><button class="btn" data-act="exclude">Exclude</button>`}
        ${oneInGroup ? '<button class="btn" data-act="set-cover">Set as cover</button>' : ""}
        ${store.assets ? '<button class="btn danger" data-act="delete-photos">Delete</button>' : ""}
        <button class="btn ghost" data-act="clear-sel">Clear</button></div>`;
      }
      const items = store.bagItems(bag.id).filter((i) => (i.photoIds || []).length);
      const todo = items.filter((i) => !i.analyzedAt).length;
      if (this.app.pipeline.run) return "";
      if (!items.length) return "";
      if (!todo) return `<div class="dock-in"><span class="grow small muted">All items are analyzed.</span><button class="btn primary" data-act="tab" data-tab="listings">See listings</button></div>`;
      const canAnalyze = this.claude.canAnalyze();
      return `<div class="dock-in"><span class="grow small muted">${canAnalyze ? "Claude writes one listing per item." : "Analysis is off here. You can fill in listings by hand."}</span>
      ${canAnalyze ? `<button class="btn primary" data-act="analyze">Analyze ${plural(todo, "item")}</button>` : '<button class="btn primary" data-act="manual-ready">Fill in by hand</button>'}</div>`;
    }
  };

  // src/app/App.js
  var App = class {
    constructor() {
      this.ui = new UiState();
      this.toast = new Toast();
      this.sheets = new SheetManager();
      this.clipboard = new Clipboard(this.sheets);
      this.wake = new ScreenWake();
      this.store = new Store(this);
      this.claude = new ClaudeService(this);
      this.ingestor = new Ingestor(this);
      this.pipeline = new Pipeline(this);
      this.inventory = new Inventory(this);
      this.forms = new Forms(this);
      this.backup = new BackupService(this);
      this.renderer = new Renderer(this);
      this.controller = new Controller(this);
    }
    render() {
      this.renderer.render();
    }
    go(route, quiet) {
      this.ui.route = Object.assign({}, route);
      this.ui.menu = null;
      if (route.bagId) this.store.watchBag(route.bagId);
      try {
        localStorage.setItem("rl-route", JSON.stringify(this.ui.route));
      } catch (e) {
      }
      if (!quiet) window.scrollTo(0, 0);
      this.render();
    }
    async start() {
      this.controller.attach();
      this.render();
      let rt;
      try {
        rt = await LocalRuntime.open();
      } catch (e) {
        this.ui.bootError = String(e && e.message || e);
        this.ui.booted = true;
        this.render();
        return;
      }
      await this.store.attach(rt);
      await this.claude.attach(rt.sample);
      this.ui.booted = true;
      this.store.subscribe();
      try {
        const saved = localStorage.getItem("rl-route");
        if (saved) {
          const r = JSON.parse(saved);
          if (r && r.view) this.go(r, true);
        }
      } catch (e) {
      }
      this.render();
    }
  };

  // src/main.js
  var app = new App();
  window.ALister = app;
  app.start();
})();

</script>

}
</script>
