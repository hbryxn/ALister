const freeCanvas = (c) => { if (c) { c.width = 0; c.height = 0; } };

/** Decode an image file straight into a canvas no larger than maxEdge (iOS canvas limit). */
async function imageToCanvas(blob, name, maxEdge) {
  let src = blob;
  let dims = await imageDims(src);
  if (!dims && isHeicFile(blob, name)) { src = await heicToJpeg(blob); dims = await imageDims(src); }
  if (!dims) throw new Error('unreadable image');
  const t = Core.fitSize(dims.w, dims.h, maxEdge);
  const canvas = canvasOf(t.width, t.height);
  const ctx = canvas.getContext('2d');
  let bmp = null;
  try {
    bmp = await createImageBitmap(src, { resizeWidth: t.width, resizeHeight: t.height, resizeQuality: 'high' });
    ctx.drawImage(bmp, 0, 0, t.width, t.height);
  } catch (e) {
    ctx.drawImage(dims.img, 0, 0, t.width, t.height);
  } finally {
    if (bmp && bmp.close) bmp.close();
    URL.revokeObjectURL(dims.url);
    dims.img.src = '';
  }
  return canvas;
}

async function pdfPageToCanvas(pdf, pageNo, maxEdge) {
  const page = await pdf.getPage(pageNo);
  try {
    const vp1 = page.getViewport({ scale: 1 });
    const scale = maxEdge / Math.max(vp1.width, vp1.height);
    const vp = page.getViewport({ scale });
    const canvas = canvasOf(Math.floor(vp.width), Math.floor(vp.height));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    return canvas;
  } finally { page.cleanup(); }
}

function scaledCopy(src, maxEdge) {
  const t = Core.fitSize(src.width, src.height, maxEdge);
  const c = canvasOf(t.width, t.height);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, t.width, t.height);
  return c;
}

/** dHash plus a blank-render check from a small canvas. */
function hashCanvas(src) {
  const c = canvasOf(9, 8);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, 9, 8);
  const d = ctx.getImageData(0, 0, 9, 8).data;
  const gray = [];
  for (let i = 0; i < d.length; i += 4) gray.push(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
  const mean = gray.reduce((a, b) => a + b, 0) / gray.length;
  const variance = gray.reduce((a, b) => a + (b - mean) * (b - mean), 0) / gray.length;
  return { hash: Core.dHashFromGray(gray), blank: variance < 0.5 };
}

async function normalizeEntry(entry, maxEdge) {
  const full = entry.pdf ? await pdfPageToCanvas(entry.pdf, entry.page, maxEdge) : await imageToCanvas(entry.blob, entry.name, maxEdge);
  let thumb = null;
  try {
    thumb = scaledCopy(full, THUMB_EDGE);
    const { hash, blank } = hashCanvas(thumb);
    if (blank) throw new Error('page rendered blank');
    const fullBlob = await toBlob(full, 0.82);
    const thumbBlob = await toBlob(thumb, 0.7);
    return { fullBlob, thumbBlob, width: full.width, height: full.height, hash };
  } finally { freeCanvas(full); freeCanvas(thumb); }
}

const sourceKey = (name, page, size) => name + '#' + (page || 0) + '#' + (size || 0);

async function startIngest(bagId, fileList) {
  if (!S.assets || S.readOnly) { toast('Only the owner of this copy can add photos.'); return; }
  if (S.ingest && S.ingest.running) { toast('Photos are still being added.'); return; }
  // Camera files are named in shooting order (IMG_1001, IMG_1002…); keep that order so a garment's photos stay together.
  const files = [...fileList].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }) || a.lastModified - b.lastModified);
  if (!files.length) return;
  S.ingest = { bagId, running: true, stop: false, files, done: 0, total: null, skipped: [], current: 'Counting photos…', maxEdge: FULL_EDGE, added: 0, blocked: null };
  S.paused = false;
  render();
  S.ingest.total = await countInputs(files);
  // Quota check before the bag (§4.3)
  try {
    const { usage } = await S.assets.list();
    S.usage = usage;
    const left = usage.maxBytes - usage.bytes;
    const need = S.ingest.total * (EST_FULL_BYTES + EST_THUMB_BYTES);
    const smallNeed = S.ingest.total * (EST_FULL_BYTES * 0.62 + EST_THUMB_BYTES);
    if (need > left) {
      const choice = await askQuota(need, smallNeed, left);
      if (choice === 'cancel') { S.ingest.running = false; S.ingest.current = ''; render(); return; }
      if (choice === 'small') S.ingest.maxEdge = FULL_EDGE_SMALL;
    }
  } catch (e) { devLog('quota check failed', e); }
  await runIngest();
}

function askQuota(need, smallNeed, left) {
  return new Promise((resolve) => {
    const mb = (b) => (b / 1048576).toFixed(0) + ' MB';
    openSheet(`<h2>Storage is getting full</h2>
      <p>These photos need about ${mb(need)}, and this copy has ${mb(Math.max(0, left))} left. Smaller photos (1600 px) need about ${mb(smallNeed)} and still read fine for listings.</p>
      <div class="acts"><button class="btn ghost" data-q="cancel">Cancel</button><button class="btn" data-q="full">Add anyway</button><button class="btn primary" data-q="small">Use smaller photos</button></div>`,
    (el) => el.addEventListener('click', (ev) => { const b = ev.target.closest('[data-q]'); if (b) { closeSheet(); resolve(b.dataset.q); } }),
    () => resolve('cancel'));
  });
}

async function runIngest() {
  const ing = S.ingest;
  if (!ing) return;
  ing.running = true; ing.stop = false; S.paused = false;
  holdWake();
  const bagId = ing.bagId;
  await waitFor(() => S.photosBag === bagId && S.photosLoaded, 8000);
  const existing = new Set(bagPhotos().map((p) => sourceKey(p.sourceName, p.sourcePage, p.sourceSize)));
  const hashes = bagPhotos().map((p) => ({ id: p.id, hash: p.hash }));
  let order = bagPhotos().reduce((m, p) => Math.max(m, p.order || 0), 0);
  ing.done = 0;
  try {
    for (const file of ing.files) {
      for await (const entry of expandInput(file)) {
        if (ing.stop) return;
        const label = entry.name + (entry.page ? ' p.' + entry.page : '');
        ing.current = label; render();
        if (entry.error) { ing.skipped.push(label + ' (' + entry.error + ')'); ing.done++; continue; }
        const key = sourceKey(entry.name, entry.page, entry.size);
        if (existing.has(key)) { ing.done++; continue; }
        let norm;
        try { norm = await normalizeEntry(entry, ing.maxEdge); }
        catch (e) { ing.skipped.push(label + ' (' + (e.message || 'could not be read') + ')'); ing.done++; continue; }
        let full, thumb;
        try {
          full = await S.assets.upload(norm.fullBlob, { type: 'image/jpeg' });
          thumb = await S.assets.upload(norm.thumbBlob, { type: 'image/jpeg' });
        } catch (e) {
          if (full) S.assets.delete(full.id).catch(() => {});
          if (e && e.code === 'quota_or_state') { ing.blocked = 'quota'; return; }
          if (e && e.code === 'rate_limited') { ing.blocked = 'rate'; return; }
          ing.skipped.push(label + ' (upload failed)'); ing.done++; continue;
        }
        order++;
        const id = rid('p');
        const dup = hashes.find((h) => Core.hamming(h.hash, norm.hash) <= 4);
        const doc = { id, bagId, order, assetId: full.id, thumbAssetId: thumb.id, width: norm.width, height: norm.height, hash: norm.hash,
          sourceName: entry.name, sourcePage: entry.page || null, sourceSize: entry.size || null, createdAt: nowIso() };
        if (dup) doc.dupOf = dup.id;
        await write(R.photo(bagId, id), 'set', doc);
        hashes.push({ id, hash: norm.hash });
        existing.add(key);
        ing.done++; ing.added++;
        await saveBag(bagId, { photoCount: order });
        render();
      }
    }
    ing.current = '';
    ing.finished = true;
    toast('Added ' + plural(ing.added, 'photo'));
  } finally {
    ing.running = false;
    releaseWake();
    render();
  }
  // Hands-off mode: go straight on to finding items and writing listings.
  const bag = S.bags.get(bagId);
  if (ing.finished && ing.added && settings().autoProcess && canAnalyze() && bag && bag.status === 'ingesting' && !bagItems(bagId).length) {
    runFind(bagId, { auto: true });
  }
}

/* ---------- AI pipeline (§5). Every step is saved before the next starts. ---------- */

const STOP_CODES = ['rate_limited', 'session_expired', 'not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'images_unavailable',
  'no_key', 'auth', 'billing', 'permission', 'model_unavailable', 'offline'];
// Codes that keep failing until the user changes something in Settings.
const BLOCKING_CODES = ['auth', 'billing', 'permission', 'model_unavailable', 'no_key', 'capability_disabled', 'not_granted', 'sampling_disabled', 'not_declared', 'capability_removed', 'images_unavailable'];
const SAMPLE_MSG = {
  not_signed_in: 'Sign in to your Claude account to let Claude read your photos. You can still enter listings by hand.',
  no_key: 'Add your Anthropic API key in Settings to let Claude read your photos.',
  auth: 'Anthropic rejected the API key. Check it in Settings.',
  billing: 'Anthropic reports a billing problem with this API key, such as no credit left. Add credit in the Anthropic Console, then tap Resume.',
  permission: 'This API key is not allowed to use the chosen model. Pick another model in Settings or check the key.',
  model_unavailable: 'The chosen Claude model is not available to this API key. Pick another model in Settings.',
  offline: 'Could not reach Anthropic. Check the internet connection, then tap Resume.',
  invalid_request: 'Anthropic rejected this step as malformed.',
  rate_limited: IN_CLAUDE ? 'You have reached your Claude usage limit for now. Everything so far is saved. Tap Resume when your limit resets.' : 'Anthropic is limiting how fast this key can make requests. Everything so far is saved. Tap Resume in a few minutes.',
  session_expired: 'Your Claude session expired. Sign in again, then tap Resume.',
  not_granted: 'Claude was not allowed for this page, so analysis is off. You can still enter listings by hand.',
  sampling_disabled: 'Claude is not available on this account, so analysis is off. You can still enter listings by hand.',
  not_declared: 'This copy was published without Claude access. Republish it with the sample capability to analyze photos.',
  capability_disabled: 'Claude is not available in this view.',
  capability_removed: 'This Claude app is too old to analyze photos. Update the app or use claude.ai in a browser.',
  images_unavailable: 'This copy cannot send photos to Claude. Republish it with sample images turned on.',
  refused: 'Claude declined to describe these photos.',
  invalid_json: 'Claude replied in a form the app could not read.',
  invalid_schema: 'Claude’s answer was missing fields or had out-of-range values.',
  empty_completion: 'Claude returned nothing.',
  image_rejected: 'A photo was rejected as too large or unreadable.',
  prompt_too_large: 'Too much to send in one step.',
  upstream_error: 'The connection to Claude dropped.'
};
const sampleMsg = (e) => SAMPLE_MSG[e && e.code] || SAMPLE_MSG.upstream_error;
const canAnalyze = () => !!(S.sample && S.sample.ready() && S.limits && S.limits.images && !S.sampleBlocked);

function newRun(bagId, kind) {
  S.run = { bagId, kind, ctl: null, stopped: false, reason: null, label: '', step: 0, total: 0, current: null, stream: '', message: null };
  S.paused = false;
  holdWake();
  render();
  return S.run;
}
function endRun(run) {
  if (S.run === run) S.run = null;
  releaseWake();
  if (run.message) S.lastMessage = { bagId: run.bagId, text: run.message, detail: run.detail };
  S.lastOfferContinue = run.offerContinue ? run.bagId : null;
  render();
}
function stopRun(reason) {
  const run = S.run;
  if (!run) return;
  run.stopped = true; run.reason = reason || 'cancel';
  if (run.ctl) run.ctl.abort();
}
let streamTimer = 0;
function streamTo(run) {
  return ({ text }) => {
    run.stream = text;
    const m = text.match(/"name"\s*:\s*"([^"]{3,})"/);
    if (m) run.streamName = m[1];
    if (!streamTimer) streamTimer = setTimeout(() => { streamTimer = 0; render(); }, 250);
  };
}

/* job doc helpers */
function loadJob(bagId) { return Object.assign({ failed: [] }, clone(S.photosBag === bagId && S.job ? S.job : {})); }
const saveJob = (bagId, job) => { job.updatedAt = nowIso(); return write(R.job(bagId), 'set', clone(job)); };
function addFailure(job, f) { job.failed = (job.failed || []).filter((x) => x.key !== f.key).concat([Object.assign({ at: nowIso() }, f)]); }
function clearFailures(job, pred) { job.failed = (job.failed || []).filter((x) => !pred(x)); }

/** Returns true when the pipeline must stop entirely. */
function handleSampleError(run, e) {
  const code = e && e.code;
  if (code === 'cancelled') { run.message = run.reason === 'paused' ? null : 'Stopped. Your progress is saved.'; return true; }
  if (STOP_CODES.includes(code)) {
    run.message = sampleMsg(e);
    if (code === 'rate_limited' && e.message) run.detail = e.message;
    if (BLOCKING_CODES.includes(code)) S.sampleBlocked = code;
    return true;
  }
  return false;
}

/* ---------- images for Claude ---------- */
function loadImg(src) {
  return new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => reject(new Error('Photo could not be loaded')); i.src = src; });
}
/** Load a stored photo as an Image without keeping its object URL around. */
async function loadAssetImg(id) {
  const blob = await S.assets.getBlob(id);
  if (!blob) throw new Error('Photo is missing');
  const url = URL.createObjectURL(blob);
  try { return await loadImg(url); } finally { URL.revokeObjectURL(url); }
}
async function fitUnder(canvas, maxBytes, q) {
  let blob = await toBlob(canvas, q);
  while (maxBytes && blob.size > maxBytes && q > 0.35) { q -= 0.12; blob = await toBlob(canvas, q); }
  return blob;
}
const maxImgBytes = () => (S.limits && S.limits.images && S.limits.images.maxInputBytes) || 5 * 1048576;

async function contactSheet(photos) {
  // 6 x 2 tiles at 400 x 711 makes a 2400 px wide sheet, inside the model's 2576 px native long edge.
  const TW = 400, TH = 711, cols = 6, rows = Math.ceil(photos.length / cols);
  const c = canvasOf(TW * cols, TH * rows);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];
    const x = (i % cols) * TW, y = Math.floor(i / cols) * TH;
    try {
      const img = await loadAssetImg(p.thumbAssetId);
      const s = Math.min((TW - 6) / img.naturalWidth, (TH - 6) / img.naturalHeight);
      const w = img.naturalWidth * s, h = img.naturalHeight * s;
      ctx.drawImage(img, x + (TW - w) / 2, y + (TH - h) / 2, w, h);
    } catch (e) { ctx.fillStyle = '#ccc'; ctx.fillRect(x + 3, y + 3, TW - 6, TH - 6); }
    const label = '#' + p.order;
    ctx.font = 'bold 52px system-ui, sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = '#000'; ctx.fillRect(x + 4, y + 4, tw + 22, 66);
    ctx.fillStyle = '#fff'; ctx.fillText(label, x + 15, y + 57);
    ctx.strokeStyle = '#999'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, TW - 2, TH - 2);
  }
  const blob = await fitUnder(c, maxImgBytes(), 0.82);
  freeCanvas(c);
  return blob;
}

async function photoForModel(photo, edge) {
  const img = await loadAssetImg(photo.assetId);
  const t = Core.fitSize(img.naturalWidth, img.naturalHeight, edge);
  const c = canvasOf(t.width, t.height);
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, t.width, t.height);
  const blob = await fitUnder(c, maxImgBytes(), 0.86);
  freeCanvas(c);
  return blob;
}

/* ---------- response schemas (structured outputs: the reply always matches) ---------- */
const nullable = (t) => ({ anyOf: [t, { type: 'null' }] });
const obj = (props) => ({ type: 'object', additionalProperties: false, required: Object.keys(props), properties: props });
const STR = { type: 'string' };
const SCHEMA = {
  captions: obj({ captions: { type: 'array', items: obj({
    n: { type: 'integer' }, garment: STR, color: STR, brandVisible: nullable(STR),
    view: { type: 'string', enum: Core.VIEWS }, sizeText: nullable(STR),
    notableDetails: { type: 'array', items: STR }, legible: { type: 'boolean' }
  }) } }),
  grouping: obj({
    items: { type: 'array', items: obj({ tempId: STR, photoNumbers: { type: 'array', items: { type: 'integer' } }, qty: { type: 'integer' }, perUnitSizes: nullable({ type: 'array', items: STR }), reason: STR }) },
    unassigned: { type: 'array', items: { type: 'integer' } }
  }),
  analysis: obj({
    brand: STR, name: STR, category: STR, size: STR, color: STR, material: STR, measurements: nullable(STR), condition: STR,
    retailNote: nullable(STR), styleCode: nullable(STR), blurb: STR, titles: obj({ ebay: STR, vinted: STR }), depopFirstLine: STR,
    tags: { type: 'array', items: STR }, listPrice: { type: 'number' }, estSale: { type: 'number' },
    priceConfidence: { type: 'string', enum: ['low', 'med', 'high'] }, priceReasoning: STR,
    bestPlatform: { type: 'string', enum: ['ebay', 'depop', 'vinted'] }, sellerNotes: { type: 'array', items: STR },
    uncertain: { type: 'array', items: { type: 'string', enum: ['brand', 'name', 'category', 'size', 'color', 'material', 'measurements', 'condition', 'retailNote', 'styleCode', 'titles.ebay', 'listPrice', 'estSale'] } }
  })
};

/* ---------- prompts ---------- */
function captionPrompt(sheets) {
  const lines = sheets.map((s, i) => 'Sheet ' + (i + 1) + ': photos ' + s.map((p) => '#' + p.order).join(', '));
  return `You are cataloguing photos of second-hand clothing and accessories so they can be listed for resale.

You get ${sheets.length} contact sheet image(s). Each sheet holds up to 12 photo tiles in a 6-by-2 grid, read left to right, top row first. Each tile shows its photo number in a black box in its top-left corner.
${lines.join('\n')}

Write one caption for every numbered tile. Things to know:
- Photos of the same item are usually consecutive.
- Label, care-tag and price-tag close-ups often look nothing like the garment shots around them. Caption them by what the tag shows.
- Record exactly what is written on tags: brand, size, style or reference codes, composition, prices. Copy the text as written. If text is too small or blurry to read, set "legible" to false and do not guess.
- If a tile shows more than one item (a flat lay), add "multiple items" to notableDetails.
- Items may be shoes, bags or jewelry as well as clothing.

Reply with only JSON in this shape:
{"captions":[{"n":12,"garment":"black leather leggings","color":"black","brandVisible":"Alaïa","view":"label","sizeText":"36","notableDetails":["ref AA9B00121C127","100% lambskin"],"legible":true}]}

"view" must be one of: front, back, label, care_tag, price_tag, detail, measurement, flaw, other. Use null for brandVisible or sizeText when none is visible. Include every photo number listed above exactly once.`;
}

function captionLine(p) {
  const c = p.caption;
  if (!c) return '#' + p.order + ' (no caption: photo could not be read)';
  const parts = ['#' + p.order, c.view, c.garment || '?', c.color || ''];
  if (c.brandVisible) parts.push('brand: ' + c.brandVisible);
  if (c.sizeText) parts.push('size: ' + c.sizeText);
  if (c.notableDetails && c.notableDetails.length) parts.push('details: ' + c.notableDetails.join('; '));
  if (!c.legible) parts.push('tag text not legible');
  return parts.filter(Boolean).join(' | ');
}

function groupPrompt(lines, first, last) {
  return `You are grouping resale photos into items. Below are captions for photos #${first} to #${last}, in the order they were taken. Each line: number | view | what it shows | color | brand seen | size seen | details.

Rules:
- Find every unique physical item. Each distinct product is its own item, even when two items look alike (two pairs of black leggings from different brands, or in different fabrics, are two items).
- An item is one product listing. Prefer contiguous runs of photos.
- Attach label, care-tag, price-tag and measurement shots to the nearest matching garment run, even when the caption looks unlike the garment.
- Two visually identical garments with different size tags are ONE item with qty 2 and perUnitSizes, for example the same bra style photographed with an XS tag and an S tag.
- The same garment photographed again in a non-adjacent run is the same item: put all of its photos in one group (for example a front shot of the same distressed jeans that appears a few photos away from the rest).
- A photo showing several items may go in more than one group.
- Photos you cannot place go in "unassigned". Every number must appear in a group or in "unassigned".
- "reason": one short sentence on why these photos belong together.

Reply with only JSON in this shape:
{"items":[{"tempId":"g1","photoNumbers":[1,2,3],"qty":1,"perUnitSizes":null,"reason":"Front, back and care tag of the same black leggings."}],"unassigned":[]}

Captions:
${lines.join('\n')}`;
}

function analysisPrompt(item, picks) {
  const imgs = picks.map((pk, i) => (i + 1) + '. Photo #' + pk.photo.order + ' (' + ((pk.photo.caption && pk.photo.caption.view) || 'unknown view') + ')' + (pk.detail ? ', higher resolution so small print is readable' : ''));
  const caps = item.photoIds.map((id) => S.photos.get(id)).filter(Boolean).sort((a, b) => a.order - b.order).map(captionLine);
  const qty = (item.units || []).length;
  const sizes = (item.units || []).map((u) => u.size).filter(Boolean);
  const locked = (item.locked || []).map((f) => { const v = Core.getField(item, f); return v == null || v === '' ? null : '- ' + f + ': ' + JSON.stringify(v); }).filter(Boolean);
  return `You are writing a resale listing for one item from a seller's photos. The seller lists in the US on eBay, Depop and Vinted.

Images attached, in order:
${imgs.join('\n')}

Captions from an earlier pass over all of this item's photos (they may contain mistakes):
${caps.join('\n')}
${qty > 1 ? `\nQuantity: ${qty} units${sizes.length ? ' in sizes ' + sizes.join(', ') : ''}. Write one listing that covers all of them.` : ''}
${locked.length ? '\nThe seller has confirmed these values. Treat them as fact:\n' + locked.join('\n') : ''}

Rules:
- Read tags literally. Never invent a size, material, composition or style code. If a tag is not visible or not readable, give your best guess and add the field name to "uncertain".
- "uncertain" lists every field you did not read directly from a photo.
- Condition: write "New with tags" only if a retail price tag or hang tag is attached in the photos. Otherwise describe what you can see (for example "Pre-owned, no visible flaws in photos") and list "condition" in uncertain, because you cannot see every flaw.
- Never write "authentic", "genuine", "real", "legit" or any other claim about authenticity, anywhere.
- Don't name a model, fit or cut unless it is printed on a tag.
- Care labels are evidence. For example "hand wash cold, do not dry clean" with no composition visible can suggest latex or a coated fabric. Say so as a possibility and mark material uncertain; don't state it as fact.
- The item may not be clothing (shoes, bags, jewelry). Use sizing that fits the category, or "" when there is none.
- Prices are whole US dollars. estSale is what it realistically sells for after offers. listPrice leaves room for offers: about 15-25% above estSale under $100, 10-20% above for items over $100. priceReasoning is one sentence, for example "NWT, retail about $3,180; NWT designer leggings typically resell at 35-45% of retail." You cannot browse, so use what you know.
- titles.ebay: at most 80 characters, keyword-rich: brand, item type, key details, color, size. titles.vinted: shorter and plain.
- depopFirstLine: one casual line that opens a Depop description.
- tags: up to 5 Depop hashtag words, lowercase letters and digits only, no # sign.
- blurb: 2-4 sentences for buyers. No promises beyond what the photos show.
- retailNote: original retail price if a tag shows it or you know it, like "Retail $1,450"; otherwise null.
- styleCode: a style, reference or color code exactly as printed; otherwise null.
- measurements: only from a measurement photo, like "Pit to pit 18.5 in, length 20 in"; otherwise null.
- sellerNotes: 1-4 practical tips for this item (measurements buyers will ask for, re-shooting a photo, bundle ideas).
- bestPlatform: "ebay", "depop" or "vinted".
- Field names allowed in "uncertain": brand, name, category, size, color, material, measurements, condition, retailNote, styleCode, titles.ebay, listPrice, estSale.

Reply with only one JSON object in this shape:
{"brand":"","name":"","category":"","size":"","color":"","material":"","measurements":null,"condition":"","retailNote":null,"styleCode":null,"blurb":"","titles":{"ebay":"","vinted":""},"depopFirstLine":"","tags":[],"listPrice":0,"estSale":0,"priceConfidence":"low","priceReasoning":"","bestPlatform":"ebay","sellerNotes":[],"uncertain":[]}`;
}

/* ---------- pass 1 + 2: find items ---------- */
async function runFind(bagId, opts) {
  opts = opts || {};
  if (S.run || !canAnalyze()) return;
  const run = newRun(bagId, 'find');
  try {
    await waitFor(() => S.photosBag === bagId && S.photosLoaded, 8000);
    const job = loadJob(bagId);
    job.pass = 1;
    await saveBag(bagId, { status: 'grouping' });
    if (!await pass1(run, bagId, job)) return;
    const missing = bagPhotos().filter((p) => !p.excluded && !p.caption);
    if (missing.length && !opts.allowMissing) {
      run.message = plural(missing.length, 'photo') + ' could not be read. Try those steps again, or continue without them.';
      run.offerContinue = true;
      return;
    }
    if (bagItems(bagId).length) {
      await saveBag(bagId, { status: 'review' });
      job.pass = 'review'; await saveJob(bagId, job);
      go({ view: 'bag', bagId, tab: 'review' });
      return;
    }
    job.pass = 2; await saveJob(bagId, job);
    if (!await pass2(run, bagId, job)) return;
    await saveBag(bagId, { status: 'review' });
    const n = run.created || bagItems(bagId).length;
    if (opts.auto || settings().autoProcess) { chainAnalyze = bagId; toast('Found ' + plural(n, 'item') + '. Writing the listings now.'); }
    else { go({ view: 'bag', bagId, tab: 'review' }); toast('Found ' + plural(n, 'item') + '. Check the groups, then analyze.'); }
  } finally {
    endRun(run);
    if (chainAnalyze === bagId) { chainAnalyze = null; go({ view: 'bag', bagId, tab: 'listings' }, true); runAnalyze(bagId); }
  }
}
let chainAnalyze = null;

async function pass1(run, bagId, job) {
  const todo = bagPhotos().filter((p) => !p.excluded && !p.caption);
  if (!todo.length) return true;
  const perCall = Math.max(1, Math.min(S.limits.images.maxCount, 4));
  const calls = Core.chunk(Core.chunk(todo, 12), perCall);
  run.label = 'Reading photos'; run.total = calls.length; run.step = 0;
  for (const sheets of calls) {
    if (run.stopped) return false;
    run.step++; run.stream = ''; render();
    const photos = sheets.flat();
    const numbers = photos.map((p) => p.order);
    const key = 'p1:' + numbers[0] + '-' + numbers[numbers.length - 1];
    let res;
    try {
      const images = [];
      for (const s of sheets) images.push(await contactSheet(s));
      if (run.stopped) return false;
      run.ctl = new AbortController();
      res = await S.sample.json(captionPrompt(sheets), { images, signal: run.ctl.signal, modelTier: 'quick', schema: SCHEMA.captions, onText: streamTo(run) });
    } catch (e) {
      if (handleSampleError(run, e)) { await saveJob(bagId, job); return false; }
      addFailure(job, { key, pass: 1, numbers, code: e.code || 'error', message: sampleMsg(e) });
      await saveJob(bagId, job);
      continue;
    }
    const v = Core.validateCaptions(res, numbers);
    if (!v.ok) {
      addFailure(job, { key, pass: 1, numbers, code: 'invalid_schema', message: SAMPLE_MSG.invalid_schema });
      devLog('caption validation', v.errors);
      await saveJob(bagId, job);
      continue;
    }
    const byOrder = new Map(photos.map((p) => [p.order, p]));
    await writeMany(v.captions.map((c) => () => savePhoto(bagId, byOrder.get(c.n).id, { caption: c })), 4);
    clearFailures(job, (f) => f.pass === 1 && f.numbers.every((n) => numbers.includes(n) && !v.missing.includes(n)));
    if (v.missing.length) addFailure(job, { key: 'p1m:' + v.missing.join(','), pass: 1, numbers: v.missing, code: 'missing', message: 'Claude skipped these photos.' });
    job.cursor = numbers[numbers.length - 1];
    await saveJob(bagId, job);
  }
  return !run.stopped;
}

async function pass2(run, bagId, job) {
  const photos = bagPhotos().filter((p) => !p.excluded);
  if (!photos.length) { run.message = 'There are no photos to group.'; return false; }
  const byNum = new Map(photos.map((p) => [p.order, p]));
  const numbers = photos.map((p) => p.order);
  const lines = new Map(photos.map((p) => [p.order, captionLine(p)]));
  const budget = ((S.limits && S.limits.maxPromptBytes) || 262144) * 0.6;
  const avg = [...lines.values()].reduce((s, l) => s + new Blob([l]).size + 1, 0) / photos.length;
  const size = Math.max(30, Math.min(150, Math.floor((budget - 3000) / avg)));
  const wins = Core.windowsFor(numbers, size, Math.max(6, Math.round(size / 8)));
  const sig = numbers.length + ':' + numbers[0] + ':' + numbers[numbers.length - 1] + ':' + size;
  if (!job.p2 || job.p2.sig !== sig) job.p2 = { sig, n: wins.length, results: [] };
  run.label = 'Grouping photos into items'; run.total = wins.length;
  for (let w = job.p2.results.length; w < wins.length; w++) {
    if (run.stopped) return false;
    run.step = w + 1; run.stream = ''; render();
    const win = wins[w];
    let res;
    try {
      run.ctl = new AbortController();
      res = await S.sample.json(groupPrompt(win.map((n) => lines.get(n)), win[0], win[win.length - 1]), { signal: run.ctl.signal, modelTier: 'default', schema: SCHEMA.grouping, onText: streamTo(run) });
    } catch (e) {
      if (handleSampleError(run, e)) { await saveJob(bagId, job); return false; }
      addFailure(job, { key: 'p2:' + w, pass: 2, code: e.code || 'error', message: sampleMsg(e), label: 'Grouping photos #' + win[0] + '–#' + win[win.length - 1] });
      run.message = 'Grouping stopped at one step. Try it again to continue.';
      await saveJob(bagId, job);
      return false;
    }
    const v = Core.validateGrouping(res, win);
    if (!v.ok) {
      addFailure(job, { key: 'p2:' + w, pass: 2, code: 'invalid_schema', message: SAMPLE_MSG.invalid_schema, label: 'Grouping photos #' + win[0] + '–#' + win[win.length - 1] });
      run.message = 'Grouping stopped at one step. Try it again to continue.';
      devLog('grouping validation', v.errors);
      await saveJob(bagId, job);
      return false;
    }
    clearFailures(job, (f) => f.key === 'p2:' + w);
    job.p2.results.push({ items: v.items });
    await saveJob(bagId, job);
  }
  const groups = Core.mergeWindows(job.p2.results);
  run.label = 'Saving groups';
  let seq = 0, created = 0;
  for (const g of groups) {
    seq++;
    const ps = g.photoNumbers.map((n) => byNum.get(n)).filter(Boolean);
    if (!ps.length) continue;
    const front = ps.find((p) => p.caption && p.caption.view === 'front') || ps[0];
    const c = front.caption || {};
    const units = Array.from({ length: g.qty }, (_, k) => ({ n: k + 1, size: (g.perUnitSizes && g.perUnitSizes[k]) || null, status: 'draft' }));
    const id = bagId + '-' + seq;
    await putItem(blankItem({ id, bagId, seq, photoIds: ps.map((p) => p.id), coverPhotoId: front.id, coverThumb: front.thumbAssetId,
      name: [c.brandVisible, c.garment].filter(Boolean).join(' ') || 'Item ' + seq, groupReason: g.reason, units }));
    created++;
  }
  job.p2 = null; job.pass = 'review';
  clearFailures(job, (f) => f.pass === 2);
  await saveJob(bagId, job);
  run.created = created;
  return true;
}

function blankItem(base) {
  return Object.assign({
    brand: '', name: '', category: '', size: '', color: '', material: '', measurements: null, condition: '', retailNote: null,
    blurb: '', styleCode: null, titles: { ebay: '', vinted: '' }, depopFirstLine: '', tags: [], listPrice: 0, estSale: 0,
    priceConfidence: 'low', priceReasoning: '', bestPlatform: 'ebay', sellerNotes: [], uncertain: [], locked: [],
    costOverride: null, units: [{ n: 1, size: null, status: 'draft' }], photoIds: [], coverPhotoId: null, coverThumb: null,
    analyzedAt: null, modelTierApplied: null, createdAt: nowIso(), updatedAt: nowIso()
  }, base);
}

/* ---------- pass 3: analyze each item ---------- */
function tierFor(item) {
  const s = settings();
  if (s.complexTier === 'always') return 'complex';
  if (s.complexTier === 'highValue' && Number(item.estSale) >= Number(s.highValueThreshold || 300)) return 'complex';
  return 'default';
}

async function analyzeItem(item, run, regenerate) {
  const photos = (item.photoIds || []).map((id) => S.photos.get(id)).filter((p) => p && !p.excluded);
  if (!photos.length) throw { code: 'no_photos', message: 'This item has no photos.' };
  const picks = Core.choosePhotos(photos, Math.min(S.limits.images.maxCount, 12));
  const images = [];
  // Tag and label shots go at 2000 px so small print stays readable; garment shots at 1000 px.
  for (const pk of picks) images.push(await photoForModel(pk.photo, pk.detail ? 2000 : 1000));
  if (run.stopped) throw { code: 'cancelled' };
  run.ctl = new AbortController();
  const tier = tierFor(item);
  const opts = { images, signal: run.ctl.signal, modelTier: tier, schema: SCHEMA.analysis, onText: streamTo(run) };
  if (regenerate) opts.cache = false;
  const res = await S.sample.json(analysisPrompt(item, picks), opts);
  const v = Core.validateAnalysis(res);
  if (!v.ok) { devLog('analysis validation', v.errors); throw { code: 'invalid_schema', message: v.errors.join('; ') }; }
  v.value.tier = tier;
  return v.value;
}

async function runAnalyze(bagId, opts) {
  opts = opts || {};
  if (S.run || !canAnalyze()) return;
  const run = newRun(bagId, 'analyze');
  try {
    await waitFor(() => S.photosBag === bagId && S.photosLoaded, 8000);
    const job = loadJob(bagId);
    const all = bagItems(bagId).filter((i) => (i.photoIds || []).length);
    const queue = opts.only ? opts.only : all.filter((i) => !i.analyzedAt).map((i) => i.id);
    job.pass = 3; job.queue = all.map((i) => i.id);
    await saveJob(bagId, job);
    const bag = S.bags.get(bagId);
    if (bag && bag.status !== 'analyzing') await saveBag(bagId, { status: 'analyzing' });
    run.label = 'Writing listings'; run.total = queue.length; run.step = 0; run.queue = queue;
    for (const id of queue) {
      if (run.stopped) break;
      const item = S.items.get(id);
      run.step++;
      if (!item || (item.analyzedAt && !opts.only)) continue;
      run.current = id; run.stream = ''; run.streamName = ''; render();
      let v;
      try { v = await analyzeItem(item, run, false); }
      catch (e) {
        if (handleSampleError(run, e)) break;
        addFailure(job, { key: 'p3:' + id, pass: 3, itemId: id, code: e.code || 'error', message: e.code === 'no_photos' ? e.message : sampleMsg(e) });
        await saveJob(bagId, job);
        continue;
      }
      const fresh = S.items.get(id) || item;
      const { patch } = Core.applyAnalysis(fresh, v);
      patch.analyzedAt = nowIso(); patch.modelTierApplied = v.tier;
      await saveItem(id, patch);
      clearFailures(job, (f) => f.key === 'p3:' + id);
      job.cursor = id;
      await saveJob(bagId, job);
    }
    run.current = null;
    const remaining = bagItems(bagId).filter((i) => (i.photoIds || []).length && !i.analyzedAt);
    if (!remaining.length) {
      job.pass = 'done'; await saveJob(bagId, job);
      await saveBag(bagId, { status: 'ready' });
      if (!run.stopped) { toast('Listings are ready.'); go({ view: 'bag', bagId, tab: 'listings' }, true); }
    }
  } finally { endRun(run); }
}

function resumePipeline(bagId) {
  const bag = S.bags.get(bagId);
  if (!bag) return;
  S.lastMessage = null;
  if (bag.status === 'analyzing') runAnalyze(bagId);
  else runFind(bagId);
}

/* ---------- regenerate one item, with a diff before saving ---------- */
async function regenerate(itemId) {
  const item = S.items.get(itemId);
  if (!item || S.run || !canAnalyze()) { if (S.run) toast('Wait for the current analysis to finish.'); return; }
  const run = newRun(item.bagId, 'regen');
  run.current = itemId;
  const paint = () => {
    if (S.run !== run) return;
    openSheet(`<h2>Regenerating</h2><p class="muted">${esc(item.brand || '')} ${esc(item.name || '')}</p>
      <p>${run.stream ? 'Writing…' : 'Thinking…'}</p><div class="stream">${esc((run.stream || '').slice(-280))}</div>
      <div class="acts"><button class="btn" data-act="stop-run">Stop</button></div>`, null, () => stopRun('cancel'));
  };
  paint();
  const timer = setInterval(paint, 700);
  try {
    await waitFor(() => S.photosBag === item.bagId && S.photosLoaded, 8000);
    const v = await analyzeItem(item, run, true);
    clearInterval(timer);
    const fresh = S.items.get(itemId) || item;
    const { patch, changes } = Core.applyAnalysis(fresh, v);
    S.run = null;
    showDiff(fresh, patch, changes, v.tier);
  } catch (e) {
    clearInterval(timer);
    S.run = null;
    closeSheet();
    if (e && e.code === 'cancelled') return;
    handleSampleError(run, e);
    toast(e && e.code === 'invalid_schema' ? SAMPLE_MSG.invalid_schema + ' Try again.' : sampleMsg(e), 5000);
  } finally { clearInterval(timer); releaseWake(); render(); }
}

function fmtVal(v) {
  if (v == null || v === '') return '—';
  if (Array.isArray(v)) return v.join(', ') || '—';
  return String(v);
}
function showDiff(item, patch, changes, tier) {
  const locked = (item.locked || []).map((f) => Core.FIELD_LABEL[f] || f);
  const body = changes.length
    ? '<div class="diff">' + changes.map((c) => `<div><b>${esc(Core.FIELD_LABEL[c.field] || c.field)}</b><del>${esc(fmtVal(c.from))}</del><ins>${esc(fmtVal(c.to))}</ins></div>`).join('') + '</div>'
    : '<p>Nothing changed.</p>';
  openSheet(`<h2>Review changes</h2>
    <p class="muted small">${locked.length ? 'Kept your edits to: ' + esc(locked.join(', ')) + '.' : 'You have not edited any fields on this item, so all of them were rewritten.'}</p>
    ${body}
    <div class="acts"><button class="btn ghost" data-act="close-sheet">Discard</button><button class="btn primary" id="diff-save" ${changes.length ? '' : 'disabled'}>Save changes</button></div>`,
  (el) => {
    const b = $('#diff-save', el);
    if (b) b.onclick = async () => {
      patch.analyzedAt = nowIso(); patch.modelTierApplied = tier;
      closeSheet();
      await saveItem(item.id, patch);
      toast('Saved');
    };
  });
}

/* ---------- rendering ---------- */
let renderQueued = false, pendingRender = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  const run = () => { if (!renderQueued) return; renderQueued = false; paint(); };
  requestAnimationFrame(run);
  setTimeout(run, 60); // rAF pauses in hidden frames
}
function paint() {
  const main = $('#main');
  const a = document.activeElement;
  if (a && main.contains(a) && a.matches('input[type=text], input[type=password], input[type=number], input[type=date], input:not([type]), textarea')) { pendingRender = true; return; }
  $('#nav').innerHTML = navHtml();
  main.innerHTML = viewHtml();
  $('#dock').innerHTML = dockHtml();
  $('#dock').hidden = !$('#dock').innerHTML.trim();
  if (S.focusItem) { const el = document.getElementById('item-' + S.focusItem); if (el) { el.scrollIntoView({ block: 'start' }); S.focusItem = null; } }
}
document.addEventListener('focusout', () => { if (pendingRender) { pendingRender = false; setTimeout(render, 0); } });

function navHtml() {
  if (!S.booted || !S.db || !S.uid) return '';
  const v = S.route.view;

    let list = '';
    if (run.kind === 'analyze') {
      const failedIds = new Set(failed.filter((f) => f.pass === 3).map((f) => f.itemId));
      list = `<div class="runlist">${(run.queue || []).map((id) => {
        const it = S.items.get(id); if (!it) return '';
        const st = id === run.current ? '<span class="chip plum">Working</span>' : it.analyzedAt ? '<span class="chip ok">Done</span>' : failedIds.has(id) ? '<span class="chip bad">Failed</span>' : '<span class="chip">Queued</span>';
        const name = id === run.current && run.streamName ? run.streamName : [it.brand, it.name].filter(Boolean).join(' ');
        return `<div><span class="st">${st}</span><span class="grow">${esc(name)}</span></div>`;
      }).join('')}</div>`;
    }
    return `<section class="panel stack" aria-live="polite">
      <div class="spread"><h3>${esc(run.label || 'Working')}</h3><button class="btn small" data-act="stop-run">Stop</button></div>
      <div class="progress"><i style="width:${Math.max(3, pct)}%"></i></div>
      <p class="small muted">Step ${run.step || 1} of ${run.total || 1}. ${run.stream ? 'Claude is writing…' : 'Claude is thinking. This can take up to a minute per step.'} Progress is saved after every step.</p>
      ${run.stream ? `<div class="stream">${esc(run.stream.slice(-240))}</div>` : ''}
      ${list}
    </section>`;
  }
  const stalled = bag.status === 'grouping' || bag.status === 'analyzing';
  if (!stalled && !failed.length && !msg) return '';
  const failRows = failed.map((f) => {
    const what = f.pass === 3 ? (S.items.get(f.itemId) ? [S.items.get(f.itemId).brand, S.items.get(f.itemId).name].filter(Boolean).join(' ') : 'An item') : f.label || ('Reading photos ' + (f.numbers || []).slice(0, 3).map((n) => '#' + n).join(', ') + ((f.numbers || []).length > 3 ? '…' : ''));
    return `<div><span class="st"><span class="chip bad">Failed</span></span><span class="grow">${esc(what)}<br><span class="small muted">${esc(f.message || '')}</span></span>
      ${canAnalyze() ? `<button class="btn small" data-act="retry-step" data-key="${esc(f.key)}">Try this step again</button>` : ''}</div>`;
  }).join('');
  const paused = S.paused ? 'Paused. Tap Resume to continue.' : null;
  return `<section class="panel stack">
    ${stalled ? `<div class="spread"><h3>${bag.status === 'grouping' ? 'Finding items stopped' : 'Writing listings stopped'}</h3>
      ${canAnalyze() ? '<button class="btn primary" data-act="resume">Resume analysis</button>' : ''}</div>` : ''}
    ${paused || msg ? `<p>${esc(paused || msg.text)}</p>${msg && msg.detail ? `<p class="small muted">${esc(msg.detail)}</p>` : ''}` : ''}
    ${failRows ? `<div class="runlist">${failRows}</div>` : ''}
    ${S.lastOfferContinue === bag.id ? '<div class="row"><button class="btn" data-act="continue-missing">Continue without them</button></div>' : ''}
  </section>`;
}

      ${qty > 1 ? `<div class="sizes">${it.units.map((u, k) => `<input type="text" id="sz-${esc(it.id)}-${u.n}" aria-label="Size of unit ${k + 1}" placeholder="Size ${k + 1}" value="${esc(u.size || '')}" data-change="unit-size" data-id="${esc(it.id)}" data-n="${u.n}" ${ro ? 'disabled' : ''}>`).join('')}</div>` : ''}

    ${unassigned.length ? `<section class="card group" data-group="">

      <div class="thumbs">${unassigned.map((p) => selThumb(p, '', null)).join('')}</div></section>` : ''}
    ${items.length ? `<div class="groups">${groups}</div>` : `<section class="card empty"><h3>No items yet</h3><p>Select photos above, then choose Move to… → New item to make one.</p></section>`}
    ${excluded.length ? `<details class="card"><summary>Excluded photos (${excluded.length})</summary><p class="small muted">Excluded photos are kept but not used. Select one and tap Restore to bring it back.</p>
      <div class="thumbs">${excluded.map((p) => selThumb(p, 'x', null)).join('')}</div></details>` : ''}`;

/* ---------- listings ---------- */
function listingsTabHtml(bag, items) {

function unitRowHtml(it, u) {
  const multi = (it.units || []).length > 1;
  const label = (multi ? 'Unit ' + u.n : 'Status') + (u.size ? ' · ' + u.size : '');
  const sel = `<select id="st-${esc(it.id)}-${u.n}" aria-label="${esc(label)}" data-change="unit-status" data-id="${esc(it.id)}" data-n="${u.n}" ${S.readOnly ? 'disabled' : ''}>
    ${Object.entries(STATUS_LABEL).map(([k, l]) => `<option value="${k}" ${u.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  let extra = '';
  if (u.status === 'listed') {
    extra = Core.PLATFORMS.map((k) => `<label class="check small"><input type="checkbox" data-change="unit-listed" data-id="${esc(it.id)}" data-n="${u.n}" data-p="${k}" ${(u.listedOn || []).includes(k) ? 'checked' : ''}>${Core.PLATFORM_LABEL[k]}</label>`).join('');
  } else if (u.status === 'sold' && u.sale) {
    extra = `<span class="small">Sold ${money0(u.sale.price)} on ${esc(Core.PLATFORM_LABEL[u.sale.platform] || u.sale.platform)}, ${esc(fmtDate(u.sale.date))} · net <b class="num">${money(Core.realizedFor(u), 2)}</b></span>
      <button class="btn ghost small" data-act="undo-status" data-id="${esc(it.id)}" data-n="${u.n}">Undo sale</button>`;
  } else if (u.status === 'kept' || u.status === 'donated') {
    extra = `<span class="small muted">Written off at cost ${money(u.costBasisSnapshot || 0, 2)}</span><button class="btn ghost small" data-act="undo-status" data-id="${esc(it.id)}" data-n="${u.n}">Undo</button>`;
  }
  return `<div class="unit"><span class="small"><b>${esc(label)}</b></span>${sel}${extra}</div>`;
}

      ${cell('Vinted net', r.open ? money(r.net.vinted, 2) : '—', r.net.vinted < 0)}${cell('Realized', r.realized ? money(r.realized, 2) : '—', r.realized < 0)}${cell('Status', esc(st))}</tr>`;

    <div class="totals">

/* ---------- settings ---------- */
function settingsHtml() {
  const s = settings();
  const ro = S.readOnly;
  const pctIn = (key, val, label) => `<div class="field"><label for="s-${key}">${label} (%)</label><input id="s-${key}" type="text" inputmode="decimal" value="${esc(+(val * 100).toFixed(2))}" data-change="setting" data-key="${key}" data-kind="pct" ${ro ? 'disabled' : ''}></div>`;
  const moneyIn = (key, val, label) => `<div class="field"><label for="s-${key}">${label} ($)</label><input id="s-${key}" type="text" inputmode="decimal" value="${esc(val)}" data-change="setting" data-key="${key}" data-kind="money" ${ro ? 'disabled' : ''}></div>`;
  const u = S.usage;
  const usePct = u ? Math.min(100, Math.round((u.bytes / u.maxBytes) * 100)) : 0;

/* ---------- dock ---------- */
function dockHtml() {
  if (S.route.view !== 'bag') return '';
  const bag = currentBag();
  if (!bag || S.readOnly) return '';
  const tab = S.route.tab || defaultTab(bag);
  if (tab !== 'review') return '';
  if (S.sel.length) {
    const fromExcluded = S.sel.every((s) => s.from === 'x');
    const oneInGroup = S.sel.length === 1 && S.sel[0].from && S.sel[0].from !== 'x';
    return `<div class="dock-in"><span class="grow">${S.sel.length} selected</span>
      ${fromExcluded ? '<button class="btn" data-act="restore">Restore</button>' : `<button class="btn primary" data-act="move">Move to…</button><button class="btn" data-act="exclude">Exclude</button>`}
      ${oneInGroup ? '<button class="btn" data-act="set-cover">Set as cover</button>' : ''}
      ${S.assets ? '<button class="btn danger" data-act="delete-photos">Delete</button>' : ''}
      <button class="btn ghost" data-act="clear-sel">Clear</button></div>`;
  }
  const items = bagItems(bag.id).filter((i) => (i.photoIds || []).length);
  const todo = items.filter((i) => !i.analyzedAt).length;
  if (S.run) return '';
  if (!items.length) return '';
  if (!todo) return `<div class="dock-in"><span class="grow small muted">All items are analyzed.</span><button class="btn primary" data-act="tab" data-tab="listings">See listings</button></div>`;
  return `<div class="dock-in"><span class="grow small muted">${canAnalyze() ? 'Claude writes one listing per item.' : 'Analysis is off here. You can fill in listings by hand.'}</span>
    ${canAnalyze() ? `<button class="btn primary" data-act="analyze">Analyze ${plural(todo, 'item')}</button>` : '<button class="btn primary" data-act="manual-ready">Fill in by hand</button>'}</div>`;
}

/* ---------- sheets ---------- */
let sheetState = null;
function openSheet(html, setup, onDismiss) {
  const root = $('#sheet');
  const reopen = !!sheetState;
  sheetState = { onDismiss };
  root.innerHTML = `<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  root.hidden = false;
  const el = $('.sheet', root);
  if (setup) setup(el);
  if (!reopen) { const f = el.querySelector('input, textarea, select'); if (f && !isPhone()) f.focus(); }
}
function closeSheet() { const root = $('#sheet'); root.innerHTML = ''; root.hidden = true; sheetState = null; }
function dismissSheet() { const s = sheetState; closeSheet(); if (s && s.onDismiss) s.onDismiss(); }
function confirmSheet(title, text, okLabel, danger) {
  return new Promise((resolve) => {
    openSheet(`<h2>${esc(title)}</h2><p>${text}</p><div class="acts"><button class="btn ghost" data-act="close-sheet">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cf-ok">${esc(okLabel)}</button></div>`,
      (el) => { $('#cf-ok', el).onclick = () => { closeSheet(); resolve(true); }; }, () => resolve(false));
  });
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetState) dismissSheet(); });

/* ---------- copy (§6): Clipboard API, then execCommand, then select-and-copy ---------- */
async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
  }
  if (ok) {
    if (btn) { const old = btn.textContent; btn.textContent = 'Copied'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1200); }
    return;
  }
  openSheet(`<h2>Select and copy</h2><p class="small muted">This view blocked copying. The text is selected below; use your device's Copy.</p>
    <div class="field"><textarea id="copy-fallback" readonly>${esc(text)}</textarea></div><div class="acts"><button class="btn" data-act="close-sheet">Done</button></div>`,
  (el) => { const ta = $('#copy-fallback', el); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); });
}

/* ---------- field editing (locks the field) ---------- */
const LONG_FIELDS = ['blurb', 'priceReasoning', 'sellerNotes'];
const NUM_FIELDS = ['listPrice', 'estSale'];
function fieldInput(it, f, idx) {
  const id = 'ed-' + idx;
  const label = Core.FIELD_LABEL[f] || f;
  let v = Core.getField(it, f);
  if (f === 'tags') return `<div class="field"><label for="${id}">Hashtags (comma separated, max 5 used)</label><input id="${id}" type="text" data-f="${f}" value="${esc((v || []).join(', '))}"></div>`;
  if (f === 'sellerNotes') return `<div class="field"><label for="${id}">Seller notes (one per line)</label><textarea id="${id}" data-f="${f}">${esc((v || []).join('\n'))}</textarea></div>`;
  if (f === 'bestPlatform') return `<div class="field"><label for="${id}">${label}</label><select id="${id}" data-f="${f}">${Core.PLATFORMS.map((k) => `<option value="${k}" ${v === k ? 'selected' : ''}>${Core.PLATFORM_LABEL[k]}</option>`).join('')}</select></div>`;
  if (f === 'priceConfidence') return `<div class="field"><label for="${id}">${label}</label><select id="${id}" data-f="${f}">${['low', 'med', 'high'].map((k) => `<option value="${k}" ${v === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div>`;
  if (NUM_FIELDS.includes(f)) return `<div class="field"><label for="${id}">${label} ($)</label><input id="${id}" type="text" inputmode="decimal" data-f="${f}" value="${esc(v || '')}"></div>`;
  if (LONG_FIELDS.includes(f)) return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" data-f="${f}">${esc(v || '')}</textarea></div>`;
  const max = f === 'titles.ebay' ? 80 : f.startsWith('titles.') ? 100 : 0;
  return `<div class="field"><label for="${id}">${label}${max ? ` <span class="counter num" data-counter="${id}">${(v || '').length}/${max}</span>` : ''}</label>
    <input id="${id}" type="text" data-f="${f}" value="${esc(v || '')}" ${max ? `data-max="${max}"` : ''}></div>`;
}
function readField(el) {
  const f = el.dataset.f;
  const raw = el.value;
  if (f === 'tags') return raw.split(/[,\s]+/).map((t) => t.replace(/^#/, '')).filter(Boolean);
  if (f === 'sellerNotes') return raw.split('\n').map((t) => t.trim()).filter(Boolean);
  if (NUM_FIELDS.includes(f)) { const n = parseMoney(raw); return n == null ? 0 : Math.round(n); }
  if (f === 'titles.ebay') return Core.truncateTitle(raw, 80);
  return raw.trim();
}
function editFields(it, fields, title, note) {
  openSheet(`<h2>${esc(title)}</h2>${note ? `<p class="small muted">${esc(note)}</p>` : ''}
    <form id="edit-form" class="stack">${fields.map((f, i) => fieldInput(it, f, i)).join('')}
    <div class="acts"><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`,
  (el) => {
    el.addEventListener('input', (e) => {
      const t = e.target; if (!t.dataset.max) return;
      const c = el.querySelector(`[data-counter="${t.id}"]`); if (c) { c.textContent = t.value.length + '/' + t.dataset.max; c.classList.toggle('over', t.value.length > +t.dataset.max); }
    });
    $('#edit-form', el).onsubmit = async (e) => {
      e.preventDefault();
      const fresh = S.items.get(it.id) || it;
      const patch = {};
      const locked = new Set(fresh.locked || []);
      const unc = new Set(fresh.uncertain || []);
      for (const inp of el.querySelectorAll('[data-f]')) {
        const f = inp.dataset.f;
        const v = readField(inp);
        if (f.startsWith('titles.')) { patch.titles = patch.titles || Object.assign({}, fresh.titles || {}); patch.titles[f.slice(7)] = v; }
        else patch[f] = v;
        locked.add(f); unc.delete(f);
        if (f === 'titles.ebay') patch.titleTruncated = false;
      }
      patch.locked = [...locked]; patch.uncertain = [...unc];
      closeSheet();
      await saveItem(it.id, patch);
      toast('Saved');
    };
  });
}

/* ---------- unit status (§7) ---------- */
function unitKey(it, n) { return it.id + ':' + n; }
function costBasisNow(it, n) {
  const bag = S.bags.get(it.bagId);
  return Core.allocateCosts(bag, bagItems(it.bagId), settings()).basis[unitKey(it, n)] || 0;
}
async function setUnits(it, units) { await saveItem(it.id, { units }); }

function saleSheet(it, n) {
  const s = settings();
  const u = it.units.find((x) => x.n === n);
  const defPlat = (u.listedOn && u.listedOn[0]) || S.platform;
  openSheet(`<h2>Mark as sold</h2><p class="muted">${esc([it.brand, it.name].filter(Boolean).join(' '))}${u.size ? ' · ' + esc(u.size) : ''}</p>
    <form id="sale-form" class="stack">
      <div class="grid2">
        <div class="field"><label for="sl-price">Sale price ($)</label><input id="sl-price" type="text" inputmode="decimal" required value="${esc(Core.platformEst(it, defPlat, s) || '')}"></div>
        <div class="field"><label for="sl-plat">Platform</label><select id="sl-plat">${Core.PLATFORMS.map((k) => `<option value="${k}" ${k === defPlat ? 'selected' : ''}>${Core.PLATFORM_LABEL[k]}</option>`).join('')}<option value="other">Somewhere else (no fee)</option></select></div>
        <div class="field"><label for="sl-date">Date</label><input id="sl-date" type="date" value="${today()}"></div>
        <div class="field"><label for="sl-ship">Shipping you paid ($)</label><input id="sl-ship" type="text" inputmode="decimal" value="${esc(s.defaultShippingCovered || 0)}"></div>
      </div>
      <label class="check"><input id="sl-boost" type="checkbox" ${s.ui.depopBoost ? 'checked' : ''}> Sold through Depop Boost</label>
      <p class="small muted" id="sl-sum"></p>
      <div class="acts"><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button><button type="submit" class="btn primary">Mark sold</button></div>
    </form>`,
  (el) => {
    const basis = costBasisNow(it, n);
    const calc = () => {
      const price = parseMoney($('#sl-price', el).value) || 0;
      const plat = $('#sl-plat', el).value;
      $('#sl-boost', el).closest('label').hidden = plat !== 'depop';
      const fee = Core.feeFor(price, plat, s.fees, { boost: plat === 'depop' && $('#sl-boost', el).checked });
      const ship = parseMoney($('#sl-ship', el).value) || 0;
      $('#sl-sum', el).textContent = `Fee ${money(fee, 2)} · your cost ${money(basis, 2)} · shipping ${money(ship, 2)} · profit ${money(price - fee - basis - ship, 2)}`;
    };
    el.addEventListener('input', calc); el.addEventListener('change', calc); calc();
    $('#sale-form', el).onsubmit = async (e) => {
      e.preventDefault();
      const price = parseMoney($('#sl-price', el).value);
      if (price == null || price < 0) { toast('Enter the sale price.'); return; }
      const fresh = S.items.get(it.id) || it;
      const sale = Core.makeSale({ price, platform: $('#sl-plat', el).value, date: $('#sl-date', el).value || today(), shippingPaid: parseMoney($('#sl-ship', el).value) || 0, boost: $('#sl-boost', el).checked }, s, costBasisNow(fresh, n));
      const units = clone(fresh.units).map((x) => (x.n === n ? Object.assign(x, { status: 'sold', sale, costBasisSnapshot: sale.costBasisSnapshot }) : x));
      closeSheet();
      await setUnits(fresh, units);
      toast('Marked sold');
    };
  }, () => render());
}

async function changeStatus(it, n, status) {
  const u = it.units.find((x) => x.n === n);
  if (!u || u.status === status) return;
  if (status === 'sold') { saleSheet(it, n); return; }
  const units = clone(it.units);
  const t = units.find((x) => x.n === n);
  if (status === 'kept' || status === 'donated') {
    delete t.sale;
    if (!Core.isClosed(t)) t.costBasisSnapshot = Core.round2(costBasisNow(it, n));
    t.status = status;
  } else {
    // Back to draft/listed: undo clears the snapshot and the sale; the unit reallocates.
    delete t.sale; delete t.costBasisSnapshot;
    t.status = status;
    if (status === 'listed' && !(t.listedOn || []).length) t.listedOn = [S.platform];
  }
  await setUnits(it, units);
}

/* ---------- review: moving photos ---------- */
async function movePhotos(sel, targetId) {
  const bagId = S.route.bagId;
  let target = targetId;
  if (targetId === '__new') {
    const items = bagItems(bagId);
    const seq = items.reduce((m, i) => Math.max(m, i.seq || 0), 0) + 1;
    target = bagId + '-' + seq + '-' + Math.random().toString(36).slice(2, 5);
    const first = S.photos.get(sel[0].pid);
    await putItem(blankItem({ id: target, bagId, seq, photoIds: [], coverPhotoId: first ? first.id : null, coverThumb: first ? first.thumbAssetId : null, name: 'New item' }));
  }
  const byItem = new Map();
  const touch = (id) => { if (!byItem.has(id)) { const it = S.items.get(id); byItem.set(id, it ? (it.photoIds || []).slice() : []); } return byItem.get(id); };
  for (const s of sel) {
    if (s.from && s.from !== 'x' && s.from !== target) { const arr = touch(s.from); const i = arr.indexOf(s.pid); if (i >= 0) arr.splice(i, 1); }
    if (target) { const arr = touch(target); if (!arr.includes(s.pid)) arr.push(s.pid); }
  }
  const emptied = [];
  for (const [id, photoIds] of byItem) {
    const it = S.items.get(id);
    const ordered = photoIds.map((pid) => S.photos.get(pid)).filter(Boolean).sort((a, b) => a.order - b.order).map((p) => p.id);
    const patch = { photoIds: ordered };
    if (it && !ordered.includes(it.coverPhotoId)) { patch.coverPhotoId = ordered[0] || null; patch.coverThumb = ordered[0] ? S.photos.get(ordered[0]).thumbAssetId : null; }
    if (id === target && targetId === '__new') { patch.coverPhotoId = ordered[0] || null; patch.coverThumb = ordered[0] ? S.photos.get(ordered[0]).thumbAssetId : null; }
    await saveItem(id, patch);
    if (!ordered.length && id !== target) emptied.push(id);
  }
  // Moving a photo out of an excluded state re-includes it.
  for (const s of sel) if (s.from === 'x') await savePhoto(bagId, s.pid, { excluded: false });
  S.sel = [];
  render();
  for (const id of emptied) {
    const it = S.items.get(id);
    if (it && !(it.units || []).some((u) => Core.isClosed(u)) && await confirmSheet('Delete the empty item?', 'Item "' + esc(it.name || id) + '" has no photos left.', 'Delete item', true)) await write(R.item(id), 'delete');
  }
}

async function deletePhotos(sel) {
  const bagId = S.route.bagId;
  const pids = [...new Set(sel.map((s) => s.pid))];
  const affected = bagItems(bagId).filter((it) => (it.photoIds || []).some((p) => pids.includes(p)));
  const willEmpty = affected.filter((it) => (it.photoIds || []).every((p) => pids.includes(p)));
  const ok = await confirmSheet('Delete ' + plural(pids.length, 'photo') + '?', 'This permanently deletes the photo files from this bag.' +
    (willEmpty.length ? ' These items will have no photos left and will be deleted too: ' + willEmpty.map((i) => esc(i.name || 'Untitled')).join(', ') + '.' : ''), 'Delete', true);
  if (!ok) return;
  S.sel = [];
  for (const it of affected) {
    const photoIds = it.photoIds.filter((p) => !pids.includes(p));
    if (!photoIds.length) await write(R.item(it.id), 'delete');
    else {
      const patch = { photoIds };
      if (!photoIds.includes(it.coverPhotoId)) { patch.coverPhotoId = photoIds[0]; patch.coverThumb = (S.photos.get(photoIds[0]) || {}).thumbAssetId || null; }
      await saveItem(it.id, patch);
    }
  }
  for (const pid of pids) {
    const p = S.photos.get(pid);
    if (!p) continue;
    if (S.assets) { await S.assets.delete(p.assetId).catch(() => {}); await S.assets.delete(p.thumbAssetId).catch(() => {}); }
    await write(R.photo(bagId, pid), 'delete');
  }
  toast('Deleted ' + plural(pids.length, 'photo'));
}

async function deleteBag(bagId) {
  const bag = S.bags.get(bagId);
  const ok = await confirmSheet('Delete "' + (bag.name || 'this bag') + '"?', 'This permanently deletes the bag, its items, sales records and every photo file. It cannot be undone.', 'Delete bag', true);
  if (!ok) return;
  toast('Deleting bag…', 60000);
  try {
    const snap = await R.photos(bagId).get();
    for (const d of snap.docs) {
      const p = d.data();
      if (S.assets) { await S.assets.delete(p.assetId).catch(() => {}); await S.assets.delete(p.thumbAssetId).catch(() => {}); }
      await write(R.photo(bagId, d.id), 'delete');
    }
    for (const it of bagItems(bagId)) await write(R.item(it.id), 'delete');
    await write(R.job(bagId), 'delete');
    await write(R.bag(bagId), 'delete');
    go({ view: 'home' });
    toast('Bag deleted');
  } catch (e) { toast('Could not finish deleting. Try again.'); }
}

function setDeep(obj, path, val) {
  const keys = path.split('.');
  const out = {};
  let cur = out;
  keys.forEach((k, i) => { if (i === keys.length - 1) cur[k] = val; else { cur[k] = {}; cur = cur[k]; } });
  return out;
}

/** Collect files from a drop, walking into dropped folders. */
async function filesFromDrop(dt) {
  const entries = [...(dt.items || [])].map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  const walk = async (entry) => {
    if (entry.name.startsWith('.')) return;
    if (entry.isFile) out.push(await new Promise((res, rej) => entry.file(res, rej)));
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch;
      do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const e of batch) await walk(e); } while (batch.length);
    }
  };
  for (const e of entries) await walk(e);
  return out;
}

async function downloadBlob(blob, filename) {
  // Inside claude.ai, pages can't start downloads themselves; the platform asks the viewer to save the file.
  if (S.rt && S.rt.inClaude) {
    if (!S.rt.downloads) throw new Error('Saving files is not available in this view.');
    try { await S.rt.downloads.save({ filename, data: blob }); return; }
    catch (e) { throw new Error(e && e.code === 'declined' ? 'Save cancelled.' : (e && e.message) || 'Could not save the file.'); }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function backupZip() {
  const say = (t) => { S.backupStatus = t; const el = $('#backup-status'); if (el) el.textContent = t; };
  try {
    say('Packing your data…');
    await loadScript(LIBS.jszip);
    const zip = new window.JSZip();
    zip.file('resale-lister.json', JSON.stringify({ app: 'ALister', version: VERSION, exportedAt: nowIso(), docs: S.rt.db._dump() }));
    const ids = S.assets.ids();
    const folder = zip.folder('photos');
    for (let i = 0; i < ids.length; i++) {
      const b = await S.assets.getBlob(ids[i]);
      if (b) folder.file(ids[i] + '.jpg', b);
      if (i % 50 === 0) say('Packing photos ' + i + ' of ' + ids.length + '…');
    }
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    await downloadBlob(blob, 'alister-backup-' + today() + '.zip');
    say('Backup saved (' + (blob.size / 1048576).toFixed(0) + ' MB, ' + plural(ids.length, 'photo file') + ').');
  } catch (e) { say('Backup failed: ' + (e.message || e)); }
}

async function restoreBackup(file) {
  const ok = await confirmSheet('Restore this backup?', 'Bags, items, sales and photos from the backup are added to this device. Anything with the same name in the backup replaces what is here.', 'Restore', false);
  if (!ok) return;
  const say = (t) => { S.backupStatus = t; const el = $('#backup-status'); if (el) el.textContent = t; else toast(t, 4000); };
  try {
    say('Reading backup…');
    await loadScript(LIBS.jszip);
    const zip = await window.JSZip.loadAsync(file);
    const meta = zip.file('resale-lister.json');
    if (!meta) throw new Error('This ZIP is not a ALister backup.');
    const data = JSON.parse(await meta.async('string'));
    const photos = Object.values(zip.files).filter((f) => !f.dir && /^photos\/[0-9a-f]+\.jpg$/.test(f.name));
    for (let i = 0; i < photos.length; i++) {
      const id = photos[i].name.slice(7, -4);
      await S.assets.putWithId(id, new Blob([await photos[i].async('blob')], { type: 'image/jpeg' }));
      if (i % 50 === 0) say('Restoring photos ' + i + ' of ' + photos.length + '…');
    }
    // Backups are keyed under data/users/<id>; move them to this device's user.
    const docs = Object.entries(data.docs || {});
    for (const [path, body] of docs) {
      const parts = path.split('/');
      if (parts[0] !== 'data' || parts[1] !== 'users') continue;
      parts[2] = S.uid;
      await S.db.doc(parts.join('/')).set(body);
    }
    say('Restored ' + plural(docs.length, 'record') + ' and ' + plural(photos.length, 'photo file') + '.');
    toast('Backup restored');
  } catch (e) { say('Restore failed: ' + (e.message || e)); }
}

async function refreshUsage() {
  if (!S.assets) return;
  try { S.usage = (await S.assets.list()).usage; } catch (e) { S.usage = null; }
  render();
}

/* ---------- wiring ---------- */
document.addEventListener('click', (e) => {
  if (e.target.matches('[data-scrim]')) { dismissSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); } return; }
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'file-in') { const bag = currentBag(); if (bag && el.files.length) startIngest(bag.id, el.files); el.value = ''; return; }
  if (el.id === 'quick-in' || el.id === 'quick-folder') { const files = [...el.files]; el.value = ''; quickStart(files); return; }
  if (el.id === 'restore-in') { const f = el.files[0]; el.value = ''; if (f) restoreBackup(f); return; }
  const fn = el.dataset && CHG[el.dataset.change];
  if (fn) fn(el, e);
});
document.addEventListener('submit', async (e) => {
  if (e.target.id === 'key-form') { e.preventDefault(); saveKey(); return; }
  if (e.target.id !== 'newbag') return;
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  if (!name) { toast('Give the bag a name.'); return; }
  const id = rid('b');
  await write(R.bag(id), 'set', { id, name, createdAt: nowIso(), purchaseCost: parseMoney(f.cost.value) || 0, purchaseDate: f.date.value || today(), source: f.source.value.trim(), status: 'ingesting', photoCount: 0 });
  go({ view: 'bag', bagId: id, tab: 'photos' });
});
// Drag and drop: files onto the drop zone; photos between review groups (pointer devices).
document.addEventListener('dragover', (e) => {
  const drop = e.target.closest && e.target.closest('#drop, #quick-drop');
  const group = e.target.closest && e.target.closest('[data-group]');
  if (drop) { e.preventDefault(); drop.classList.add('over'); }
  else if (group && dragSel) { e.preventDefault(); document.querySelectorAll('.drop-target').forEach((g) => g.classList.remove('drop-target')); group.classList.add('drop-target'); }
});
document.addEventListener('dragleave', (e) => { const d = e.target.closest && e.target.closest('#drop, #quick-drop'); if (d) d.classList.remove('over'); });
let dragSel = null;
document.addEventListener('dragstart', (e) => {
  const t = e.target.closest && e.target.closest('.thumb[data-pid]');
  if (!t) return;
  const me = { pid: t.dataset.pid, from: t.dataset.from };
  dragSel = isSel(me.pid, me.from) ? S.sel.slice() : [me];
  e.dataTransfer.setData('text/plain', me.pid);
  e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragend', () => { dragSel = null; document.querySelectorAll('.drop-target').forEach((g) => g.classList.remove('drop-target')); });
document.addEventListener('drop', (e) => {
  const drop = e.target.closest && e.target.closest('#drop, #quick-drop');
  if (drop) {
    e.preventDefault(); drop.classList.remove('over');
    const bag = drop.id === 'drop' ? currentBag() : null;
    const isQuick = drop.id === 'quick-drop';
    filesFromDrop(e.dataTransfer).then((files) => {
      if (!files.length) return;
      if (isQuick) quickStart(files); else if (bag) startIngest(bag.id, files);
    });
    return;
  }
  const group = e.target.closest && e.target.closest('[data-group]');
  if (group && dragSel) {
    e.preventDefault();
    const sel = dragSel; dragSel = null;
    movePhotos(sel, group.dataset.group || null);
  }
});
window.addEventListener('dragover', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', (e) => { if (e.dataTransfer && e.dataTransfer.files.length && !(e.target.closest && e.target.closest('#drop, #quick-drop'))) e.preventDefault(); });

boot();

})();
</script>
